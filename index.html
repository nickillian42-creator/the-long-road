<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151d16"><title>The Long Road — Alpha 0.2.2</title><style>
:root{font-family:ui-monospace,Menlo,Consolas,monospace;color:#e8e8cf;background:#101510}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#2c3527,#101510 75%);min-height:100vh}main{max-width:690px;margin:auto;padding:20px 16px 60px}h1{color:#c9e69c;letter-spacing:.14em;font-size:clamp(26px,7vw,43px);margin:8px 0}h2{font-size:20px;color:#c9e69c}h3{font-size:16px}p{line-height:1.55}small,.muted{color:#a3af94}header{border-bottom:1px solid #58694b;margin-bottom:20px;padding-bottom:10px}.eyebrow{color:#b3cb87;font-size:11px;letter-spacing:.2em}.panel{border:1px solid #52654a;background:#1a241a;padding:16px;border-radius:8px;margin:14px 0;box-shadow:0 5px 20px #0003}.art{height:170px;position:relative;overflow:hidden;background:linear-gradient(#554c37 0%,#a77743 48%,#504733 49%,#33392c 70%,#1b201a 70%);border-radius:5px;border:1px solid #706c4a;margin:12px 0}.art:before{content:'☢';position:absolute;right:16%;top:10%;font-size:46px;color:#d6b77b66}.art:after{content:'▰▰▰';position:absolute;bottom:25px;left:24%;font-size:38px;letter-spacing:-8px;color:#101510;text-shadow:0 8px #090c09}.road{position:absolute;bottom:0;width:100%;height:26px;background:#181c19;border-top:3px dashed #c2a76a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{background:#2a3828;border:1px solid #43583c;padding:9px;border-radius:5px;font-size:12px}.stat b{display:block;color:#e5f5c4;font-size:17px;margin-top:4px}button,input,select{font:inherit}button{background:#354b30;color:#eff5df;border:1px solid #91b279;padding:13px 12px;min-height:47px;border-radius:5px;cursor:pointer;text-align:left}button:hover,button:focus{background:#506c43}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#b5d58b;color:#142011;font-weight:900;text-align:center;width:100%;margin-top:10px}.primary:hover{background:#d5ecb3}.choice{display:block;width:100%;margin:8px 0}.choice.selected{background:#5d7648;border-color:#e5efbc}.field{width:100%;padding:13px;background:#0f180f;color:white;border:1px solid #91b279;border-radius:5px;margin:6px 0 12px}.bar{height:9px;background:#34432f;border-radius:9px;overflow:hidden;margin:8px 0}.bar span{display:block;height:100%;background:#b8d68a}.log{max-height:175px;overflow:auto;font-size:12px;color:#bfcaa9}.log div{border-bottom:1px solid #344231;padding:6px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:11px;border:1px solid #82996b;padding:4px 7px;border-radius:3px;color:#c4dfa1}.danger{color:#f4a79a}.success{color:#bde7a1}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.footer{margin-top:24px;font-size:11px;color:#8e9e82}.hidden{display:none}label{display:block;margin:10px 0}.hero{font-size:14px;color:#f4dcb0}#toast{position:fixed;bottom:12px;left:12px;right:12px;max-width:660px;margin:auto;background:#c4e1a0;color:#152011;padding:12px;border-radius:5px;display:none;z-index:3}@media(min-width:600px){.art{height:240px}.stats{grid-template-columns:repeat(6,1fr)}}
/* ---- ALPHA 0.2 visual framework: illustrated scenes, portraits, motion ---- */
#app>*{animation:screenIn .38s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.scene{position:relative;overflow:hidden;border-radius:5px;border:1px solid #706c4a;margin:12px 0;min-height:170px;background:linear-gradient(#554c37 0%,#a77743 48%,#504733 49%,#33392c 70%,#1b201a 70%)}
.scene img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.scene .shade{position:absolute;inset:0;background:linear-gradient(#0000 55%,#101510cc);pointer-events:none}
.scene .car{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(62%,330px);filter:drop-shadow(0 10px 12px #000a)}
.scene .car img{width:100%;display:block;border-radius:4px}
.roadmove{position:absolute;bottom:0;left:0;width:200%;height:24px;background:repeating-linear-gradient(90deg,#c2a76a 0 34px,#181c19 34px 68px);border-top:3px solid #c2a76a;opacity:.8;animation:roadmove 1.6s linear infinite;pointer-events:none}
@keyframes roadmove{to{transform:translateX(-68px)}}
.dust{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#d6b77b22 1.5px,#0000 2px),radial-gradient(#d6b77b18 1px,#0000 1.6px);background-size:90px 60px,140px 90px;animation:dust 9s linear infinite}
@keyframes dust{to{background-position:90px 0,140px 0}}
.portrait{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #91b279;flex:none;background:#2a3828}
.speaker{display:flex;gap:10px;align-items:center;margin:10px 0}
.speaker b{color:#e5f5c4}
.carcard img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:4px;margin-bottom:8px;display:block;background:#2a3828}
@media(min-width:600px){.scene{min-height:240px}.portrait{width:76px;height:76px}}
@media(prefers-reduced-motion:reduce){#app>*{animation:none}.roadmove,.dust{animation:none}}
/* ---- ALPHA 0.2.2 prologue & quests ---- */
.scene-tall{min-height:230px}
.kenburns{animation:kenburns 14s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.09)}}
.dots{display:flex;gap:10px;justify-content:center;margin:14px 0}
.dots span{width:10px;height:10px;border-radius:50%;background:#43583c}
.dots span.on{background:#c9e69c;box-shadow:0 0 8px #c9e69c88}
.prologue-text{white-space:pre-line;cursor:pointer;line-height:1.7;font-size:16px}
.typecaret{color:#c9e69c;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.quest-done{color:#bde7a1}
.quest-current{color:#f4dcb0}
/* ---- Cinematic prologue presentation: full-bleed art, title overlaid, script-style narration ---- */
body.cinema header,body.cinema .footer{display:none}
body.cinema main{max-width:100%;padding:0 0 44px}
.cine-art{position:relative;min-height:48vh;overflow:hidden;border-bottom:1px solid #706c4a;background:#0c100c}
.cine-art img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cine-art .shade{position:absolute;inset:0;background:linear-gradient(#10151055 0%,#0000 40%,#101510e6 92%);pointer-events:none}
.cine-title{position:absolute;left:0;right:0;bottom:0;padding:60px 22px 20px}
.cine-title>div{max-width:640px;margin:0 auto}
.cine-title h2{font-size:clamp(24px,6.4vw,36px);margin:6px 0 4px;letter-spacing:.05em;text-shadow:0 2px 14px #000}
.cine-script{max-width:660px;margin:0 auto;padding:20px 22px 6px}
.cine-script .prologue-text{max-height:34vh;overflow-y:auto;padding:2px 8px 14px 2px;-webkit-overflow-scrolling:touch}
.cine-controls{max-width:660px;margin:0 auto;padding:4px 22px 0}
.cine-controls .row button{flex:1;min-height:52px;font-size:15px}
.cine-controls .choice{margin-top:12px;min-height:52px;text-align:center}
@media(min-width:600px){.scene-tall{min-height:320px}.cine-art{min-height:56vh}.cine-script .prologue-text{max-height:40vh;font-size:17px}}
@media(prefers-reduced-motion:reduce){.kenburns,.typecaret{animation:none}}
/* ---- Milestone 2: inventory + scavenging prototype ---- */
.inv-tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}
.inv-tabs button{min-height:56px;text-align:center;font-weight:900;letter-spacing:.12em}
.inv-tabs button.selected{background:#5d7648;border-color:#e5efbc}
.inv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0}
@media(min-width:600px){.inv-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.slot{min-height:64px;font-size:13px}
.slot small{display:block;color:#a3af94;font-size:11px;margin-top:3px}
.slot.sel{background:#5d7648;border-color:#e5efbc}
.slot.empty{opacity:.25;min-height:44px}
.detail{border:1px solid #91b279;border-radius:8px;padding:12px;margin:12px 0;background:#22301f}
.detail h3{margin:4px 0 6px;color:#e5f5c4}
.found{border:2px solid #e8c96a;border-radius:8px;padding:14px;margin:14px 0;background:#2a2417}
.found h3{color:#f4dcb0;margin:6px 0}
.discovery{border:3px solid #f4dcb0;background:#33291a;box-shadow:0 0 22px #f4dcb055;padding:18px}
.discovery h3{font-size:19px;color:#ffe9c4;margin:8px 0}
.loot-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #4a3f28}
.loot-row>span:first-child{font-size:16px;color:#ffe9c4}
.loot-btns{display:flex;gap:8px}
.loot-btns button{min-height:44px;padding:10px 14px}
</style></head><body><main><header><div class="eyebrow">CONTINUITY NETWORK // 2089</div><h1>THE LONG ROAD</h1><div class="row"><span class="muted">EVERY MILE COSTS SOMETHING.</span><span class="tag">ALPHA 0.2.2</span></div></header><div id="app"></div><div class="footer">An original prototype. Saves locally in this browser. No accounts or network required.</div></main><div id="toast" role="status"></div><script>
const $=s=>document.querySelector(s),app=$('#app');let g=null,selected='',difficulty='story',sex='Male',car='eagle';const cars={eagle:{name:'AMC Eagle',fuel:32,food:17,water:17,parts:5,hp:75,eff:1.0,wear:3,desc:'Balanced wagon. Efficient and adaptable.'},wagon:{name:'Jeep Wagoneer',fuel:48,food:23,water:22,parts:6,hp:100,eff:1.6,wear:2,desc:'Heavy hauler. Tough, thirsty, and spacious.'},raptor:{name:'Baby Raptor',fuel:40,food:14,water:16,parts:4,hp:90,eff:1.3,wear:1,desc:'Off-road specialist. Fast but cramped.'},m4:{name:'BMW M4',fuel:36,food:11,water:13,parts:3,hp:65,eff:1.4,wear:5,desc:'Highway rocket. Fragile on ruined roads.'}};const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(t,fn,cls='')=>`<button class="${cls}" onclick="${fn}">${t}</button>`;
const ASSETS='assets/';


const img=(f,cls,alt='')=>`<img src="${ASSETS}${f}" class="${cls}" alt="${alt}" onerror="this.remove()">`;


const scene=(bg,inner='')=>`<div class="scene">${img(bg,'bg')}<div class="shade"></div><div class="dust"></div>${inner}</div>`;


const portrait=f=>img(f,'portrait');


/* regionBg/regionName retired in Milestone 1 with the legacy mile-gated road loop.
   Future world/region logic will live in sim/world.js. */


function fatTier(f){return f>=75?'Exhausted':f>=40?'Tired':'Rested'}


function maxFatigue(){let m=g.pfat,n='YOU';g.crew.forEach(c=>{if(c.hp>0&&c.fatigue>m){m=c.fatigue;n=c.name}});return{m:m,n:n}}


function notify(s){let t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}

function log(s){g.log.unshift('DAY '+g.day+': '+s);g.log=g.log.slice(0,35)}

function screen(s){app.innerHTML=s;window.scrollTo(0,0)}

function stat(k,v){return `<div class="stat">${k}<b>${v}</b></div>`}

function hud(){const f=maxFatigue(),tier=fatTier(f.m);const cmark=c=>(c.injury!=='healthy'?' ['+c.injury.toUpperCase()+']':'')+(c.hp<=0?' [OUT]':'');return `<div class="row"><span class="tag">DAY ${g.day}</span><span class="tag">${g.miles} / 780 MI</span></div><div class="bar"><span style="width:${Math.min(100,g.miles/780*100)}%"></span></div><div class="stats">${stat('FUEL',g.fuel.toFixed(1))}${stat('FOOD'+(g.food<=4?' · LOW':''),g.food)}${stat('WATER'+(g.water<=4?' · LOW':''),g.water)}${stat('PARTS',g.parts)}${stat('MEDS',g.meds)}${stat('TRUCK'+(g.hp<30?' · LIMP':''),g.hp+'%')}</div><div class="bar"><span style="width:${f.m}%;background:${f.m>=75?'#dc8c78':f.m>=40?'#e8c96a':'#b8d68a'}"></span></div><p class="muted">FATIGUE ${f.m} · ${escapeHtml(f.n)} (${tier})${g.rationing?' · RATIONING':''}</p><p class="muted">${escapeHtml(g.name)} · HP ${g.health}${g.injury!=='healthy'?' ['+g.injury.toUpperCase()+']':''} · ${escapeHtml(cars[g.car].name)} · ${g.crew.filter(c=>c.hp>0).length+(g.health>0?1:0)} survivors${g.crew.map(c=>' · '+escapeHtml(c.name)+cmark(c)).join('')}</p>`}


function newQuests(){return {main:{id:'last-transmission',title:'THE LAST TRANSMISSION',objectives:[{id:'leave-mercy',text:'Leave Mercy before the water runs out',done:false},{id:'cross-north-texas',text:'Cross North Texas',done:false},{id:'cross-panhandle',text:'Cross the Panhandle',done:false},{id:'cross-corridor',text:'Survive the Dead Corridor',done:false},{id:'cross-mountains',text:'Cross the mountain passage',done:false},{id:'reach-station',text:'Reach Continuity Station Seven',done:false},{id:'uncover-truth',text:'Discover the truth behind the transmission',done:false},{id:'mercy-fate',text:'Decide the fate of Mercy',done:false}]},personal:{id:'find-them',title:'FIND THEM',stage:0},completed:[]};}


function questObj(id){return g.quests.main.objectives.find(o=>o.id===id);}


function completeObjective(id,silent){const o=questObj(id);if(o&&!o.done){o.done=true;if(!silent){log('Objective complete: '+o.text);notify('Quest updated: '+o.text);}}}


function updateQuests(silent){if(!g||!g.quests)return;if(g.flags.mercy!==undefined)completeObjective('leave-mercy',silent);if(g.flags.stranger!==undefined&&g.flags.stranger!=='met')completeObjective('cross-north-texas',silent);if(g.flags.droneResult!==undefined)completeObjective('cross-panhandle',silent);if(g.flags.pass)completeObjective('cross-corridor',silent);if(g.flags.passResolved)completeObjective('cross-mountains',silent);if(g.miles>=780)completeObjective('reach-station',silent);if(g.flags.ending!==undefined){completeObjective('uncover-truth',silent);completeObjective('mercy-fate',silent);}}


function discover(title,text){if(!g.discoveries.some(d=>d.title===title)){g.discoveries.unshift({title:title,text:text,day:g.day});log('Discovery: '+title);notify('Discovery recorded: '+title);}}


function save(){if(g)localStorage.setItem('longroad_v01',JSON.stringify(g))}

function migrateSave(s){if(!s.v)s.v=1;if(s.v<2){s.v=2;if(!s.quests)s.quests=newQuests();if(!s.discoveries)s.discoveries=[];}if(s.v<3){s.v=3;if(s.pfat===undefined)s.pfat=0;if(!s.injury)s.injury='healthy';if(s.woundedDays===undefined)s.woundedDays=0;if(s.antibiotics===undefined)s.antibiotics=2;if(s.rationing===undefined)s.rationing=false;(s.crew||[]).forEach(c=>{if(c.fatigue===undefined)c.fatigue=0;if(!c.injury)c.injury='healthy';if(c.woundedDays===undefined)c.woundedDays=0;if(c.neglectDone===undefined)c.neglectDone=false;});}if(s.v<4){s.v=4;
if(s.chapter===undefined)s.chapter=1;
if(!s.consequences)s.consequences=[];
if(!s.settlements)s.settlements={};
if(!s.npcs)s.npcs={};
if(!s.encounters)s.encounters={};
if(!s.mercy)s.mercy={contact:'none',infoTransmitted:[],supportSent:{},lastKnown:'stable'};
if(!s.route)s.route=s.sex==='Female'?'evelyn':'jack';
if(!s.spouseName)s.spouseName=s.sex==='Female'?'Daniel':'Claire';
if(s.quests&&!s.quests.personal)s.quests.personal={id:'find-them',title:'FIND THEM',stage:0};
if(s.flags&&s.consequences.length===0){var _mc=['took only what Mercy offered','convinced Mercy to vote for extra supplies','secretly took extra water','promised to return in fourteen days','scavenged outside Mercy and lost a day'];var _sm=['shared water with a desperate traveler','questioned a bloodied stranger','let a stranger follow the convoy','left a traveler behind','robbed a traveler at gunpoint'];var _bc=function(k,l,d){s.consequences.push({day:1,chapter:1,miles:0,kind:k,label:l,detail:d,actors:[],outcome:null,resolved:false,backfilled:true});};if(s.flags.mercy!==undefined&&s.flags.mercy!==null&&_mc[s.flags.mercy])_bc('decision','Mercy departure','Left Mercy: '+_mc[s.flags.mercy]+'.');if(typeof s.flags.stranger==='number'&&_sm[s.flags.stranger])_bc('encounter','The stranger','On the road: '+_sm[s.flags.stranger]+'.');if(s.flags.droneResult!==undefined)_bc('encounter','Custodian sentry','Faced a Custodian sentry on the road.');if(s.flags.pass)_bc('encounter','Mountain passage','Crossed the mountain passage.');if(s.flags.hankSecret)_bc('npc',"Josh's secret",'Josh admitted his group lost people near the old interstate works. Something was wrong there. He never understood what.');}
}
// M5 retcon correction: Eli stays in Mercy; he is never a traveling crew member.
// M5: legacy road-loop phases have no live renderer; land on the safe end-of-Chapter-One card.
if(s.v<5){s.v=5;
if(Array.isArray(s.crew))s.crew=s.crew.filter(function(c){return c&&c.name!=='Eli';});
var _lp=['opening','road','crew','journal','quest','battle','event','end','arrival','breakdown'];
if(_lp.indexOf(s.phase)>=0)s.phase='phase1_done';
}
// M6 (Milestone 2): simulation state — individual inventories, survival,
// scavenging. Conservative: fills only what's missing; empty packs, neutral
// hunger/thirst/health, no speculative content.
if(s.v<6){s.v=6;initSimState(s);}
return s}


/* Combined Milestone 2 sim-state initializer. Defensive: only fills fields
   that are missing, so v5 saves migrate cleanly and new games start sane. */
function initSimState(s){initInvState(s);initSurvState(s);if(!s.scav)s.scav={};if(!('found'in s))s.found=null;if(s.together===undefined)s.together=true;return s}


var CONSEQUENCE_KINDS=['decision','encounter','settlement','npc','mercy','quest'];


function recordConsequence(kind,label,detail,extra){if(CONSEQUENCE_KINDS.indexOf(kind)<0)return null;var e={day:g.day,chapter:g.chapter||1,miles:g.miles||0,kind:kind,label:label||'',detail:detail||'',actors:[],outcome:null,resolved:false};if(extra)for(var k in extra)e[k]=extra[k];if(!g.consequences)g.consequences=[];g.consequences.push(e);return e;}


function npcState(id){if(!g.npcs)g.npcs={};if(!g.npcs[id])g.npcs[id]={met:false,status:'alive',disposition:0,treatment:null,lastSeen:null};return g.npcs[id];}


function settleState(id){if(!g.settlements)g.settlements={};if(!g.settlements[id])g.settlements[id]={visited:false,disposition:'unknown',supportGiven:{},decisions:[],outcome:null};return g.settlements[id];}


function encounterState(id){if(!g.encounters)g.encounters={};if(!g.encounters[id])g.encounters[id]={seen:0,outcome:null,day:0};return g.encounters[id];}


function noteTreatment(id,key){const n=npcState(id);if(!Array.isArray(n.treatment))n.treatment=[];if(n.treatment.indexOf(key)<0)n.treatment.push(key);return n.treatment}

function start(){document.body.classList.remove('cinema');let existing=localStorage.getItem('longroad_v01');screen(`${scene('bg-title.webp')}<div class="panel"><h2>COLORADO IS CALLING.</h2><p>Sixty years after the collapse began in the shadow of the autonomous defense network CUSTODIAN, a transmission reaches Mercy, Texas. It promises clean water in Colorado. Your settlement has nineteen days left.</p><p class="hero">Four survivors. One vehicle. 780 miles. The road remembers.</p>${btn('NEW JOURNEY','prologue(0)','primary')}${existing?btn('CONTINUE SAVED JOURNEY','resume()','choice'):''}${hasProtoSave()?btn('CONTINUE PROTOTYPE','resumeProto()','choice'):''}<div class="eyebrow">PROTOTYPE SYSTEMS</div>${btn('SCAVENGING PROTOTYPE','scavProto()','choice')}</div>`)}

function create(){document.body.classList.remove('cinema');selected='';screen(`<h2>01 / YOUR SURVIVOR</h2><p>Choose your character. Your name will appear throughout the journey.</p><div class="panel"><div class="grid">${btn('MALE','setSex("Male")','choice selected',)}${btn('FEMALE','setSex("Female")','choice')}</div><label for="name">SURVIVOR NAME</label><input id="name" class="field" maxlength="20" placeholder="Enter your name" autocomplete="off"><small>Both characters have the same abilities and story opportunities.</small>${btn('CONTINUE','chooseDifficulty()','primary')}</div>`)}

function setSex(v){sex=v;document.querySelectorAll('.grid button').forEach(b=>b.classList.toggle('selected',b.textContent.toLowerCase()===v.toLowerCase()))}

let playerName='';

function chooseDifficulty(){playerName=$('#name').value.trim();if(!playerName){notify('Enter a survivor name.');return}screen(`<h2>02 / CHOOSE YOUR ROAD</h2><div class="panel"><h3>STORY MODE</h3><p>Forgiving resources. Replay from your most recent chapter checkpoint.</p>${btn('SELECT STORY MODE','setDifficulty("story")','choice selected')}<h3>SURVIVAL MODE</h3><p>Scarcer resources, permanent deaths, and one continuously updated save.</p>${btn('SELECT SURVIVAL MODE','setDifficulty("survival")','choice')}<h3>THE LAST ROAD</h3><p>Extreme scarcity. Your crew dies, your journey ends.</p>${btn('SELECT THE LAST ROAD','setDifficulty("hard")','choice')}${btn('CONTINUE','chooseCar()','primary')}</div>`)}

function setDifficulty(v){difficulty=v;document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',b.textContent.toLowerCase().includes(v==='hard'?'last road':v)))}

function chooseCar(){screen(`<h2>03 / MERCY MOTOR POOL</h2><p>Pick the vehicle that will carry your crew to Colorado.</p><div class="panel">${Object.entries(cars).map(([k,v])=>`<button class="choice carcard ${k===car?'selected':''}" onclick="setCar('${k}')">${img('vehicle-'+k+'.webp','',v.name)}<b>${escapeHtml(v.name)}</b><br><small>${v.desc}<br>Fuel ${v.fuel} gal · Condition ${v.hp}% · Parts ${v.parts}</small></button>`).join('')}${btn('BEGIN THE LONG ROAD','begin()','primary')}</div>`)}

function setCar(v){car=v;document.querySelectorAll('.choice').forEach((b,i)=>b.classList.toggle('selected',Object.keys(cars)[i]===v))}

function hankRepair(){g.phase='hank_repair';save();document.body.classList.remove('cinema');const n=npcState('hank');n.met=true;
const isF=g.sex==='Female';
const routeBeat=isF
?`<p>Something is wrong with the seating — not the housing. You lean in close, and there it is: the alignment pin sheared clean through. Everyone has been fighting the housing. The housing was never the problem.</p><p><b>Josh:</b> “Well. Forty-nine years old and getting schooled.” A beat. “You’ve got eyes, I’ll give you that.”</p>`
:`<p>The housing is seized solid, rust welded to rust. Josh watches you take the strain.</p><p><b>Josh:</b> “Easy — give her some of that Mercer persuasion. Easy now…”</p><p>The housing breaks free with a crack like a knuckle popping.</p><p><b>Josh:</b> “Remind me never to arm-wrestle you.”</p>`;
screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="speaker">${portrait('portrait-hank.webp')}<div><b>Josh</b><br><small class="muted">Mercy mechanic</small></div></div><p>The workshop yard smells of hot metal and old oil. Josh Rourke has the north pump’s housing cracked open on the bench, and he’s looking at you like you’re the only spare pair of hands in Mercy.</p><p><b>Josh:</b> “There you are. Hold this steady — steady, not strangled. It’s a pump housing, not a raider.”</p>${routeBeat}<p><b>Josh:</b> “Hand me my tire iron — the old one.”</p><p>The iron is worn smooth as river stone from decades of hands. It has gotten Josh Rourke out of more trouble than he will ever admit.</p><p><b>Josh:</b> “Center bolt now. Nice and easy…”</p><p><b>Josh:</b> “Strip that bolt and I’m making you explain it to Ruth.”</p>${btn('“Wouldn’t dream of it.”','hankRepairChoice(0)','choice')}${btn('“When have I ever stripped a bolt?”','hankRepairChoice(1)','choice')}</div>`)}



function hankRepairChoice(n){
const reply=n===0
?`<p><b>Josh:</b> “Good answer. Ruth scares me worse than raiders, and I’ve met raiders.”</p>`
:`<p><b>Josh:</b> “Tuesday.”</p><p><b>You:</b> “That was a screw.”</p><p><b>Josh:</b> “It had threads. It counts.”</p>`;
if(n===0){noteTreatment('hank','repair_careful');}
g.flags.tireIronSeen=true;save();
screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="speaker">${portrait('portrait-hank.webp')}<div><b>Josh</b><br><small class="muted">Mercy mechanic</small></div></div>${reply}<p>The bolt turns. The pump seats true.</p><p>His hands tremble faintly at rest — you catch it when he sets the wrench down. The moment he takes up a tool again, they go still as stone.</p><p><b>Josh:</b> “You've been taking things apart since I got here. I used to find my wrenches in the dirt behind your house.”</p><p><b>Josh:</b> “Ruth’s been asking after you. Go on — Mara’s short-handed at the clinic, and Eli’s probably flooded the water station by now. Be useful somewhere.”</p>${btn('“Your hands were shaking.”','hankHandsFollow()','choice')}${btn('HEAD INTO MERCY','mercyHub()','primary')}</div>`)}



function mercyBlurb(kind){const k='blurb_'+kind;const n=(g.flags[k]=(g.flags[k]||0)+1);
const pools={day1:[
"<p>Mercy isn’t much to look at, and the people here will tell you so with pride. Patchwork walls. Salvaged everything. Gardens growing in old tires. A hundred and eighty-six people who have kept each other alive for sixty years.</p>",
"<p>Mercy goes about its morning — the workshop humming, the clinic smelling of soap, the water station coughing along.</p>",
"<p>Someone’s mending a fence. Someone’s laughing. A pump coughs in the distance. Mercy keeps being Mercy.</p>"],day2:[
"<p>Mercy is packing, in its way. Supplies change hands in doorways. Nobody says goodbye out loud yet.</p>",
"<p>The truck sits ready in the yard. People find reasons to walk past it.</p>",
"<p>Goodbyes happen sideways here — an extra portion pressed into your hands, a tool oiled and returned.</p>",
"<p>The light slants lower. Whatever the day held, it’s nearly spent.</p>"]};
const pool=pools[kind];return pool[Math.min(n-1,pool.length-1)];}

const ex=g.flags.mercyExplore;
const b=(key,label,fn)=>ex[key]?`<p class="muted">✓ ${label} — visited</p>`:btn(label,fn+'()','choice');
const done=ex.workshop&&ex.clinic&&ex.water;
screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="eyebrow">DAY 1</div><h2>MERCY, TEXAS</h2>${mercyBlurb('day1')}<p class="muted">Ruth wants to see you. But first, Mercy is yours to walk.</p>${b('workshop','WORKSHOP — Josh Rourke','mercyWorkshop')}${b('clinic','CLINIC — Mara Velez','mercyClinic')}${b('water','WATER STATION — Eli Boone','mercyWater')}${done?`<hr>${btn('RUTH CALDER — the council table','ruthCrisis()','primary')}`:`<p class="muted">Check in around Mercy first. Ruth can wait a little.</p>`}</div>`)}



function mercyWorkshop(){g.phase='mercy_workshop';if(!g.flags.mercyExplore)g.flags.mercyExplore={workshop:false,clinic:false,water:false};g.flags.mercyExplore.workshop=true;const n=npcState('hank');n.met=true;save();
const isF=g.sex==='Female';
screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="speaker">${portrait('portrait-hank.webp')}<div><b>Josh</b><br><small class="muted">Mercy mechanic</small></div></div><div class="eyebrow">THE WORKSHOP</div><p>The drill press is older than the Collapse. Half the tools on the wall are too. Everything in here has been repaired, re-repaired, and repaired again — and somehow it all still works.</p><p>Josh is truing a warped flange, tongue caught between his teeth in concentration.</p><p><b>Josh:</b> “Back again? You miss me, or are you avoiding Ruth?”</p>${btn('“Put me to work.”','mercyWorkshopHelp()','choice')}${btn('“How old is that drill press?”','mercyWorkshopAge()','choice')}</div>`)}

const beat=isF?`<p>You sort his fastener chaos by logic only you can see. Twenty minutes later he’s working twice as fast.</p><p><b>Josh:</b> “There’s the brains of the operation.”</p>`:`<p>You haul the flange stock where he needs it without being asked. He doesn’t thank you — he just nods, which from Josh is a speech.</p><p><b>Josh:</b> “There’s the muscle of the operation.”</p>`;

function mercyWorkshopAge(){screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="speaker">${portrait('portrait-hank.webp')}<div><b>Josh</b><br><small class="muted">Mercy mechanic</small></div></div><p><b>Josh:</b> “Older than me. Don’t tell it that — it’s sensitive.”</p><p>He pats the machine like an old dog.</p><p><b>Josh:</b> “Go on. You’ve got people to see.”</p>${btn('BACK TO MERCY','mercyHub()','primary')}</div>`)}



function hankHandsFollow(){screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="speaker">${portrait('portrait-hank.webp')}<div><b>Josh</b><br><small class="muted">Mercy mechanic</small></div></div><p>Josh looks at his hands like they belong to somebody else.</p><p><b>Josh:</b> “They do that sometimes.”</p><p><b>You:</b> “Then how—”</p><p><b>Josh:</b> “Hands shake. Tools don’t. Figured out the difference a while back.”</p><p>He picks up the wrench — steady as stone.</p><p><b>Josh:</b> “Don’t worry. I only drop things I’ve already fixed.”</p>${btn('HEAD INTO MERCY','mercyHub()','primary')}</div>`)}

screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="speaker">${portrait('portrait-mara.webp')}<div><b>Mara</b><br><small class="muted">Mercy medic</small></div></div><div class="eyebrow">THE CLINIC</div><p>The clinic smells of boiled water and soap. The shelves are honest: half-empty, everything counted.</p><p>Mara is wrapping a split lip for a boy who is trying very hard not to cry.</p><p><b>Mara:</b> “Hold still. It’s a split lip, not a war wound.”</p><p>To you, without looking up: “You’re Ruth’s errand-runner today?”</p>${btn('“Put me to work.”','mercyClinicHelp()','choice')}${btn('“How bad is it, honestly?”','mercyClinicHonest()','choice')}</div>`)}



function mercyClinicHelp(){noteTreatment('mara','helped_clinic');save();
screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="speaker">${portrait('portrait-mara.webp')}<div><b>Mara</b><br><small class="muted">Mercy medic</small></div></div><p>She sets you to sorting sterilized bandages. The boiled ones go left. Her thumb brushes a small worn notebook in her pocket — then she’s back to work, and you don’t ask.</p><p><b>Mara:</b> “…Thank you.”</p><p>It costs her something to say it. That’s how you know she means it.</p>${btn('“What’s in the notebook?”','maraNotebookFollow()','choice')}${btn('BACK TO MERCY','mercyHub()','primary')}</div>`)}



function mercyClinicHonest(){screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="speaker">${portrait('portrait-mara.webp')}<div><b>Mara</b><br><small class="muted">Mercy medic</small></div></div><p><b>Mara:</b> “Bad enough I’m washing bandages. Don’t quote me.”</p><p>She doesn’t dress it up. That’s Mara — she never lies about the odds, even when the truth is thin comfort.</p><p><b>Mara:</b> “Go on. Ruth’s waiting, and I’ve got a waiting room.”</p>${btn('BACK TO MERCY','mercyHub()','primary')}</div>`)}



function maraNotebookFollow(){screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="speaker">${portrait('portrait-mara.webp')}<div><b>Mara</b><br><small class="muted">Mercy medic</small></div></div><p>She hesitates — then pulls it out. It isn’t medical. Page after page of copied routes, half-finished maps, a traveler’s warning in somebody else’s hand.</p><p><b>Mara:</b> “My wall started in here. Before I had a wall.” She tucks it away, a little embarrassed. “Don’t tell Ruth I take it on rounds. She thinks I’ll lose it.”</p>${btn('BACK TO MERCY','mercyHub()','primary')}</div>`)}

function ruthCrisis(){g.phase='ruth_crisis';const n=npcState('ruth');n.met=true;save();
screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="speaker">${portrait('portrait-ruth.webp')}<div><b>Ruth</b><br><small class="muted">Mercy council leader</small></div></div><div class="eyebrow">THE COUNCIL TABLE</div><p>Ruth Calder’s table is covered in paper — tallies, estimates, lists with things crossed out. She looks up like she’s been expecting you for an hour.</p><p><b>Ruth:</b> “Sit. I won’t waste your time, so don’t waste mine.”</p><p><b>Ruth:</b> “The north pump is dying. Eli’s patches are buying weeks, not seasons.”</p><p><b>Ruth:</b> “Mara’s down to scraps and stubbornness.”</p><p><b>Ruth:</b> “The stores are thinner than the council admits in public.”</p><p><b>Ruth:</b> “Nineteen days. That’s honest counting, not council counting.”</p><p><b>Ruth:</b> “Understand me: nineteen days is not a deadline. Nobody drops dead on day twenty. It’s the day after which we cannot keep a hundred and eighty-six people fed and watered the way we are now — not without choosing who eats. And I will not choose. Not quietly. Not ever.”</p><p>She folds her hands. For a moment she just looks tired — sixty years of decisions where every option hurt somebody.</p><p><b>Ruth:</b> “I know what’s pulling at you. I won’t pretend I don’t understand it.”</p>${btn('“Then we buy more time.”','ruthCrisisChoice(0)','choice')}${btn('“What do you need from me?”','ruthCrisisChoice(1)','choice')}${btn('[Say nothing.]','ruthCrisisChoice(2)','choice')}</div>`)}

function dayMara(){g.phase='day_mara';g.flags.mercyDay.mara=true;save();
screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="speaker">${portrait('portrait-mara.webp')}<div><b>Mara</b><br><small class="muted">Mercy medic</small></div></div><div class="eyebrow">MARA'S ROOM — MIDDAY</div><p>One wall of Mara's room is maps. Not one map — dozens, layered and overlapping: a pre-collapse highway atlas with pages soft from handling, hand-copied sheets in three different inks, Mercy supply records with routes penciled in the margins, a traveler's warning copied and recopied until the original hand is gone.</p><p>"My wall," she says, a little shy and a little proud. "Everybody brings me maps."</p><p>She finds Colorado with her finger like she's done it a thousand times. A route north, traced and retraced. "I know it on paper," she says. "Every mile."</p><p>Then, fast, like she's been holding it in: "I want to go." A breath. "Not just because you need someone who knows the way — though you do. I've spent my whole life learning the world on paper." She looks at her wall. "I want to see it for real."</p>${btn('\u201cI\u2019d be glad to have you.\u201d','dayMaraChoice(0)','choice')}${btn('\u201cIt\u2019s a hard road, Mara.\u201d','dayMaraChoice(1)','choice')}${btn('\u201cThat\u2019s Ruth\u2019s call, not mine.\u201d','dayMaraChoice(2)','choice')}</div>`)}



function dayMaraChoice(n){noteTreatment('mara','saw_map_wall');noteTreatment('mara','asked_to_come');noteTreatment('mara',['welcomed_mara','hesitated_mara','deferred_to_ruth'][n]);save();
const replies=[`<p>"Then it's settled," she says, grinning. "I'll pack the good bandages."</p>`,`<p>She nods, serious. "I know. That's why you need someone who knows the way on paper."</p>`,`<p>"Fair," she says. "But I'm asking you first."</p>`];
screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="speaker">${portrait('portrait-mara.webp')}<div><b>Mara</b><br><small class="muted">Mercy medic</small></div></div>${replies[n]}<p>She pulls down a composite sheet — her own work, stitching five sources together. Across it, in different hands from different years, the same stretch of I-40 is marked: a red line here, a skull scratched there, a note in faded pencil — <i>don't</i>. A Mercy record from eleven years back. A traveler's warning from four.</p><p>"Different people," Mara says. "Different years. Same road." She looks at you. "Nobody knows why."</p><p>"You'd cross all that for ${g.spouseName}?" she asks quietly. "Then somebody should know the way for real."</p>${btn('"Has anyone tried to find out why?"','maraWhyFollow()','choice')}${btn('BACK TO MERCY','mercyDay()','primary')}</div>`)}



function maraWhyFollow(){screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="speaker">${portrait('portrait-mara.webp')}<div><b>Mara</b><br><small class="muted">Mercy medic</small></div></div><p>“A few.” She doesn’t elaborate for a moment. “Ruth forbade the last one. Said Mercy couldn’t afford to lose people to curiosity.”</p><p>A pause. “They went anyway. They didn’t come back.”</p>${btn('BACK TO MERCY','mercyDay()','primary')}</div>`)}



function dayRuth(){g.phase='day_ruth';g.flags.mercyDay.ruth=true;save();

function dayRuthChoice(n){noteTreatment('ruth','saw_memorial');noteTreatment('ruth','heard_cadence');noteTreatment('ruth',['asked_about_sister','asked_about_cadence','sat_quietly'][n]);save();

screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="speaker">${portrait('portrait-ruth.webp')}<div><b>Ruth</b><br><small class="muted">Mercy council leader</small></div></div>${replies[n]}${vow}${btn('BACK TO MERCY','mercyDay()','primary')}</div>`)}

const reply=n===0?`<p>She studies you for a long moment. Then she nods — once, the way she does when something is decided.</p><p><b>Ruth:</b> “Then Mercy will remember that. So will I.”</p>`:`<p>Something in her face eases — not disappointment. Respect.</p><p><b>Ruth:</b> “Good. Promises shouldn’t come cheap.”</p>`;
screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="speaker">${portrait('portrait-ruth.webp')}<div><b>Ruth</b><br><small class="muted">Mercy council leader</small></div></div>${reply}${btn('BACK TO MERCY','mercyDay()','primary')}</div>`)}



function dayEli(){g.phase='day_eli';g.flags.mercyDay.eli=true;save();
screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="speaker">${portrait('portrait-eli.webp')}<div><b>Eli</b><br><small class="muted">Mercy kid</small></div></div><div class="eyebrow">THE WORKSHOP YARD — LATE AFTERNOON</div><p>Eli is trailing Josh around the yard holding a dead cell phone like a holy relic. "You didn't try the contacts this time." "I tried the contacts fourteen times." "Maybe fifteen's the one."</p><p>Josh catches your eye over the kid's head: <i>help me</i>.</p><p>When Josh finally escapes to the pump house, Eli turns the phone over in his hands and goes quieter. "Ruth says phones could keep voices. Pictures. Messages." A pause. "I'm forgetting what he sounded like. My dad."</p><p>"But listen —" Eli leans in, suddenly all business. "The broadcast? It does the same part every time. Exactly the same words, exactly the same spaces. I counted." He taps the dead phone. "I know about repeating things."</p><p>It's an observation. It's also the sharpest thing anyone's said about the Voice all day.</p><p>"I'm coming with you," Eli says. "Don't tell Josh I said. I'm coming."</p>${btn('\u201cWe\u2019ll see, Eli.\u201d','dayEliChoice(0)','choice')}${btn('\u201cIt\u2019s too dangerous. You know that.\u201d','dayEliChoice(1)','choice')}${btn('\u201cTalk to Josh about it.\u201d','dayEliChoice(2)','choice')}</div>`)}

function departure(){g.phase='departure';noteTreatment('hank','agreed_to_forty');save();
screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="eyebrow">DUSK</div><h2>LEAVING MERCY</h2><div class="speaker">${portrait('portrait-ruth.webp')}<div><b>Ruth</b><br><small class="muted">Mercy council leader</small></div></div><p>Ruth stands by the truck with her hands folded. She looks at Mara for a long moment. "You go," she says. "Learn the road for real." Then, to you: "And bring her back too." It isn't quite an order.</p><p><b>Mara:</b> "I will."</p><p>Ruth turns to Josh. The look between them is twenty years old.</p><p>"I'm asking you to go with them," Ruth says. "Through Forty. They need a mechanic. They need somebody who's survived that road."</p><p>Josh goes very still. "Ruth—"</p><p>"You know that country."</p><p>Mara unrolls her route across the hood. Josh looks at it for a long moment — the I-40 corridor, marked in her careful hand. Something in his face changes.</p><p>A long silence. Then, quietly: "I'll get you through Forty. That's all I'm promising."</p><p>For a while nobody moves. Somewhere in Mercy a dog barks, and is shushed. Wind moves through the gardens in old tires. You look toward the gate — the road beyond it, empty and waiting.</p><p>Packing is quick. Everything useful is already in piles — Mercy has been preparing for this longer than you've been asking for it. Four containers of water. Food weighed to the ounce. Mara's maps, rolled tight. Josh's tools.</p><p>Then Josh crouches to Eli's eye level, and the yard goes quiet.</p>${btn('WITNESS IT','departureArgument()','primary')}</div>`)}

/* sim/combat.js — Preserved combat primitives (Milestone 1).
   beginBattle / battle / combat are the turn-based encounter primitives from the
   retired legacy road loop, preserved verbatim for the future encounter engine
   (Milestone 3). They are currently DORMANT: no live code path calls them.

function battle(msg){if(!g.enemy)return road();g.phase='battle';save();screen(`${hud()}<div class="panel"><div class="eyebrow">TURN-BASED ENCOUNTER</div><h2>${escapeHtml(g.enemy.name)}</h2><p>ENEMY HP: ${g.enemy.hp} / ${g.enemy.max}</p><div class="bar"><span style="width:${100*g.enemy.hp/g.enemy.max}%;background:#dc8c78"></span></div><p>${escapeHtml(g.name)} HP: ${g.health} / 100</p><div class="bar"><span style="width:${g.health}%"></span></div><p class="hero">${escapeHtml(msg)}</p><div class="actions">${btn('ATTACK','combat(0)')}${btn('TALK','combat(1)')}${btn('MEDKIT ('+g.meds+')','combat(2)')}${btn('DEFEND','combat(3)')}${btn('JOSH: DISTRACT','combat(4)')}${btn('RETREAT','combat(5)')}</div><p class="muted">Ammo: ${g.ammo} · Each action uses one turn.</p></div>`)}

function combat(a){let e=g.enemy;if(!e)return;let msg='';if(a===0){if(g.ammo<=0)return notify('Out of ammunition.');g.ammo--;let d=12+Math.floor(Math.random()*12);e.hp-=d;msg='Your shot deals '+d+' damage.'}if(a===1){if(e.hp<=e.max*.4||g.flags.frequency){log('You convince the enemy to stand down.');g.flags.merciful=true;g.enemy=null;return road('The confrontation ends without another shot.')}msg='Your words fail to stop the attack.'}if(a===2){if(g.meds<=0)return notify('No medicine left.');g.meds--;g.health=Math.min(100,g.health+30);msg='You recover 30 health.'}if(a===3){e.guard=true;msg='You brace for the next attack.'}if(a===4){if(g.crew[0].hp<=0)return notify('Josh cannot help.');if(Math.random()<.65){e.hp-=9;msg='Josh distracts the enemy for 9 damage.'}else msg='Josh misses his opening.'}if(a===5){if(Math.random()<.6){g.fuel=Math.max(0,g.fuel-2);g.enemy=null;log('You escape the confrontation.');return road('You retreat and burn extra fuel.')}msg='You fail to escape.'}if(e.hp<=0){g.enemy=null;g.parts++;g.flags.combatWins=(g.flags.combatWins||0)+1;log('You survive the fight and recover one spare part.');return road(msg+' The enemy is defeated.')}let dmg=Math.max(1,e.damage+Math.floor(Math.random()*7)-3-(e.guard?Math.floor(e.damage*.7):0)-(fatTier(g.pfat)==='Exhausted'?2:0));e.guard=false;g.health=Math.max(0,g.health-dmg);if(dmg>0&&g.injury==='healthy'){const ch=g.difficulty==='story'?0.15:g.difficulty==='hard'?0.35:0.25;if(Math.random()<ch)woundChar('player')}msg+=' The enemy strikes for '+dmg+' damage.';if(g.health<=0){g.enemy=null;return end('You fall in battle. The road does not wait.')}battle(msg)}
/* sim/rng.js — Seeded RNG foundation (Milestone 1).
   Provides a deterministic PRNG (mulberry32) for future simulation systems.
   NOT wired into any gameplay yet: Chapter One uses no randomness, and the
   preserved combat primitives (sim/combat.js) still use Math.random while
   dormant. The encounter engine (Milestone 3) will adopt makeRng so runs can
   be reproduced from a seed.
   Usage (future): const rng = makeRng(12345); rng() -> [0,1); rng.int(1,6). */

function makeRng(seed) {
  let a = seed >>> 0;
  function next() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  next.int = function (lo, hi) {
    return lo + Math.floor(next() * (hi - lo + 1));
  };
  next.pick = function (arr) {
    return arr[Math.floor(next() * arr.length)];
  };
  next.seed = seed >>> 0;
  return next;
}
/* sim/difficulty.js — Difficulty architecture (Milestone 2).
   Three canonical modes. Difficulty modifies resource scarcity, survival
   pressure, risk, consequences, and recovery margins — never enemy hit points,
   and never the authored story/world (identical across modes).

   The pre-existing new-game screen offers 'story' / 'survival' / 'hard'
   (legacy labels, Chapter One setup — left untouched). normDiff() maps those
   to the canonical modes so old and new code agree:
     story    -> STORY
     survival -> SURVIVOR
     hard     -> HARDCORE SURVIVAL
   Unknown/missing values default to SURVIVOR (the intended default).

   Modifier fields:
     thirstEvery / hungerEvery : sim ticks per hunger/thirst stage advance
                                 (lower = harsher; thirst always faster)
     riskMult / noiseMult      : scavenging pressure scaling
     lootBonus                 : flat qty adjustment on authored loot
                                 (+1 story, 0 survivor, -1 hardcore)
     neglectEvery              : ticks at Starving/Dehydrated per health decline
     recoverEvery              : ticks well-fed/hydrated/treated per health recovery */

const DIFF_MODS = {
  story:    { label: 'STORY',            thirstEvery: 4, hungerEvery: 6, riskMult: 0.6, noiseMult: 0.6, lootBonus:  1, neglectEvery: 3, recoverEvery: 2 },
  survivor: { label: 'SURVIVOR',         thirstEvery: 2, hungerEvery: 3, riskMult: 1.0, noiseMult: 1.0, lootBonus:  0, neglectEvery: 2, recoverEvery: 3 },
  hardcore: { label: 'HARDCORE SURVIVAL', thirstEvery: 1, hungerEvery: 2, riskMult: 1.5, noiseMult: 1.5, lootBonus: -1, neglectEvery: 1, recoverEvery: 4 },
};

const DIFF_ALIASES = {
  story: 'story', survival: 'survivor', survivor: 'survivor',
  hard: 'hardcore', hardcore: 'hardcore',
};

function normDiff(d) { return DIFF_ALIASES[d] || 'survivor'; }

function diffMods(d) { return DIFF_MODS[normDiff(d === undefined ? (typeof g !== 'undefined' && g ? g.difficulty : undefined) : d)]; }

/* Authored loot quantity adjusted by difficulty. Applied to the first stack of
   a loot grant (keeps prototype loot legible); never drops below 0. */
function lootQtyFor(base, d, first) {
  const bonus = first ? diffMods(d).lootBonus : 0;
  return Math.max(0, base + bonus);
}
/* sim/inventory.js — Individual character inventories (Milestone 2).
   ---------------------------------------------------------------------------
   No shared magical inventory. Josh and Mara each carry their own items;
   equipped gear stays on the character wearing it. The player manages both.

   Capacity model: INV_SLOTS (10, a balance value — not canon) per character.
   One stack occupies `size` slots regardless of quantity. Consumables stack
   up to their item's `stack` max. No weight simulation.

   State: g.inv = { josh: {slots:[{item,qty}...], equipment:{weapon,utility}},
                    mara: {slots:[...], equipment:{...}} }
          g.together (bool, default true) — GIVE only when together and
                    circumstances permit; separation keeps inventories apart.
          g.found — temporary FOUND state when loot doesn't fit:
                    {who, item, qty, rest:[{item,qty}], loc}
   Transfer/separation future-proofing: every op takes an explicit character;
   nothing ever reads "the" inventory. */

const INV_SLOTS = 10;

function initInvState(s) {
  if (!s.inv) s.inv = {};
  ['josh', 'mara'].forEach(function (k) {
    if (!s.inv[k]) s.inv[k] = { slots: [], equipment: { weapon: null, utility: null } };
    if (!Array.isArray(s.inv[k].slots)) s.inv[k].slots = [];
    if (!s.inv[k].equipment) s.inv[k].equipment = { weapon: null, utility: null };
  });
  if (s.together === undefined) s.together = true;
  if (!('found' in s)) s.found = null;
  return s.inv;
}

function invKey(who) {
  const w = String(who || '').toLowerCase();
  return w === 'mara' ? 'mara' : 'josh';
}

function invState(who) {
  initInvState(g);
  return g.inv[invKey(who)];
}

function invUsedSlots(who) {
  const inv = invState(who);
  let used = 0;
  inv.slots.forEach(function (s) { const d = itemDef(s.item); used += d ? d.size : 1; });
  return used;
}

function invFreeSlots(who) { return INV_SLOTS - invUsedSlots(who); }

/* Pure add against a slot array (dry-run safe). Returns {slots, added, leftover}. */
function invAddTo(slots, itemId, qty) {
  const def = itemDef(itemId);
  const out = slots.map(function (s) { return { item: s.item, qty: s.qty }; });
  if (!def || qty <= 0) return { slots: out, added: 0, leftover: qty };
  let remaining = qty, added = 0;
  function used() {
    let u = 0;
    out.forEach(function (s) { const d = itemDef(s.item); u += d ? d.size : 1; });
    return u;
  }
  if (def.stack > 1) {
    for (let i = 0; i < out.length && remaining > 0; i++) {
      if (out[i].item === itemId && out[i].qty < def.stack) {
        const take = Math.min(def.stack - out[i].qty, remaining);
        out[i].qty += take; remaining -= take; added += take;
      }
    }
  }
  while (remaining > 0) {
    if (used() + def.size > INV_SLOTS) break;
    const take = def.stack > 1 ? Math.min(def.stack, remaining) : 1;
    out.push({ item: itemId, qty: take });
    remaining -= take; added += take;
  }
  return { slots: out, added: added, leftover: remaining };
}

function invAdd(who, itemId, qty) {
  const inv = invState(who);
  const r = invAddTo(inv.slots, itemId, qty);
  inv.slots = r.slots;
  return { added: r.added, leftover: r.leftover };
}

function invFits(who, itemId, qty) {
  return invAddTo(invState(who).slots, itemId, qty).leftover === 0;
}

function invRemove(who, itemId, qty) {
  const inv = invState(who);
  let remaining = qty, removed = 0;
  for (let i = inv.slots.length - 1; i >= 0 && remaining > 0; i--) {
    if (inv.slots[i].item === itemId) {
      const take = Math.min(inv.slots[i].qty, remaining);
      inv.slots[i].qty -= take; remaining -= take; removed += take;
      if (inv.slots[i].qty <= 0) inv.slots.splice(i, 1);
    }
  }
  return removed;
}

function invCount(who, itemId) {
  let n = 0;
  invState(who).slots.forEach(function (s) { if (s.item === itemId) n += s.qty; });
  return n;
}

function invHas(who, itemId, qty) { return invCount(who, itemId) >= (qty || 1); }

function invOther(who) { return invKey(who) === 'josh' ? 'mara' : 'josh'; }

function charName(who) { return invKey(who) === 'josh' ? 'Josh' : 'Mara'; }

/* --- Contextual actions ---------------------------------------------------
   itemActions returns only actions currently applicable:
     use     — consumable with a relevant effect right now
     equip   — weapon/utility not currently equipped (or swap)
     unequip — currently equipped
     give    — together and the other character has room
     inspect — always
     drop    — always */
function itemActions(who, itemId) {
  const def = itemDef(itemId);
  if (!def) return [];
  const k = invKey(who), inv = invState(k), acts = [];
  const surv = survOf(k);
  if (def.use) {
    let usable = false;
    if (def.use.thirst && surv.thirst > 0) usable = true;
    if (def.use.hunger && surv.hunger > 0) usable = true;
    if (def.use.cure && surv.conditions.indexOf(def.use.cure) >= 0) usable = true;
    if (def.use.stabilize && (surv.health !== 'healthy' || surv.conditions.indexOf('illness') >= 0)) usable = true;
    if (usable) acts.push('use');
  }
  if (def.equip) {
    acts.push(inv.equipment[def.equip] === itemId ? 'unequip' : 'equip');
  }
  if (g.together !== false && invHas(k, itemId, 1)) acts.push('give');
  acts.push('inspect');
  acts.push('drop');
  return acts;
}

/* USE: consumable effects dispatch into the survival system. Returns {ok, msg}. */
function invUseItem(who, itemId) {
  const k = invKey(who), def = itemDef(itemId);
  if (!def || !def.use) return { ok: false, msg: 'That can\'t be used.' };
  if (!invHas(k, itemId, 1)) return { ok: false, msg: charName(k) + ' doesn\'t have that.' };
  const surv = survOf(k);
  if (def.use.thirst && surv.thirst <= 0) return { ok: false, msg: 'Not thirsty — save it.' };
  if (def.use.hunger && surv.hunger <= 0) return { ok: false, msg: 'Not hungry — save it.' };
  if (def.use.cure && surv.conditions.indexOf(def.use.cure) < 0)
    return { ok: false, msg: 'No ' + def.use.cure + ' to treat.' };
  const msg = survApplyUse(k, def);
  invRemove(k, itemId, 1);
  return { ok: true, msg: msg };
}

function invEquip(who, itemId) {
  const k = invKey(who), def = itemDef(itemId), inv = invState(k);
  if (!def || !def.equip) return { ok: false, msg: 'That can\'t be equipped.' };
  if (!invHas(k, itemId, 1)) return { ok: false, msg: charName(k) + ' doesn\'t have that.' };
  const slot = def.equip, cur = inv.equipment[slot];
  if (cur === itemId) return { ok: false, msg: 'Already equipped.' };
  invRemove(k, itemId, 1);
  if (cur) {
    if (!invFits(k, cur, 1)) { // no room to stow the old one — undo
      invAdd(k, itemId, 1);
      return { ok: false, msg: 'No room to stow the ' + itemDef(cur).name + '.' };
    }
    invAdd(k, cur, 1);
  }
  inv.equipment[slot] = itemId;
  return { ok: true, msg: def.name + ' equipped (' + slot + ').' };
}

function invUnequip(who, slot) {
  const k = invKey(who), inv = invState(k), cur = inv.equipment[slot];
  if (!cur) return { ok: false, msg: 'Nothing equipped there.' };
  if (!invFits(k, cur, 1)) return { ok: false, msg: 'No room in ' + charName(k) + '\'s pack.' };
  inv.equipment[slot] = null;
  invAdd(k, cur, 1);
  return { ok: true, msg: itemDef(cur).name + ' stowed.' };
}

/* GIVE: only when together. Nothing moves unless the receiver has room. */
function invGive(from, to, itemId, qty) {
  const f = invKey(from), t = invKey(to);
  if (f === t) return { ok: false, msg: 'That\'s the same person.' };
  if (g.together === false)
    return { ok: false, msg: charName(f) + ' and ' + charName(t) + ' are separated — no handoffs.' };
  const n = Math.min(qty || 1, invCount(f, itemId));
  if (n <= 0) return { ok: false, msg: charName(f) + ' doesn\'t have that.' };
  if (!invFits(t, itemId, n))
    return { ok: false, msg: charName(t) + ' has no room for it.' };
  invRemove(f, itemId, n);
  invAdd(t, itemId, n);
  const def = itemDef(itemId);
  return { ok: true, msg: charName(f) + ' gives ' + charName(t) + ' ' + n + '× ' + def.name + '.' };
}

/* DROP: leaves the item at the current scavenging location's ground (loot
   persists there); otherwise it is simply discarded. */
function invDrop(who, itemId, qty) {
  const k = invKey(who);
  const n = Math.min(qty || 1, invCount(k, itemId));
  if (n <= 0) return { ok: false, msg: 'Nothing to drop.' };
  invRemove(k, itemId, n);
  const def = itemDef(itemId);
  if (g.scavLoc && g.scav && g.scav[g.scavLoc]) scavGroundAdd(g.scavLoc, itemId, n);
  return { ok: true, msg: n + '× ' + def.name + ' set down.' };
}

function invInspect(itemId) {
  const def = itemDef(itemId);
  if (!def) return '';
  return def.inspect || def.desc;
}

/* --- FOUND state ----------------------------------------------------------
   When loot doesn't fit, nothing is auto-discarded. g.found holds the
   overflow until the player resolves it: TAKE (if room now) / GIVE (other
   character) / USE (consumable) / LEAVE (drops to the location's ground).
   `rest` carries any further ungranted loot behind this item. */
function setFound(who, itemId, qty, rest, loc) {
  g.found = { who: invKey(who), item: itemId, qty: qty, rest: rest || [], loc: loc || null };
}

function clearFound() { g.found = null; }

function foundActions() {
  if (!g.found) return [];
  const f = g.found, def = itemDef(f.item), acts = [];
  if (invFits(f.who, f.item, f.qty)) acts.push('take');
  const other = invOther(f.who);
  if (g.together !== false && invFits(other, f.item, f.qty)) acts.push('give');
  if (def && def.use && itemActions(f.who, f.item).indexOf('use') >= 0) acts.push('use');
  acts.push('leave');
  return acts;
}

/* Resolves the current FOUND item; then continues with any queued rest. */
function resolveFound(action) {
  const f = g.found;
  if (!f) return { ok: false, msg: 'Nothing to resolve.' };
  const def = itemDef(f.item), other = invOther(f.who);
  let msg = '';
  if (action === 'take') {
    if (!invFits(f.who, f.item, f.qty)) return { ok: false, msg: 'Still no room.' };
    invAdd(f.who, f.item, f.qty);
    msg = charName(f.who) + ' takes ' + f.qty + '× ' + def.name + '.';
  } else if (action === 'give') {
    if (g.together === false || !invFits(other, f.item, f.qty))
      return { ok: false, msg: 'Can\'t hand it over right now.' };
    invAdd(other, f.item, f.qty);
    msg = charName(other) + ' takes ' + f.qty + '× ' + def.name + '.';
  } else if (action === 'use') {
    const r = invUseItem(f.who, f.item);
    if (!r.ok) return r;
    msg = r.msg;
    if (f.qty > 1 && invFits(f.who, f.item, f.qty - 1)) {
      invAdd(f.who, f.item, f.qty - 1);
      msg += ' The rest fits now.';
    } else if (f.qty > 1) {
      if (f.loc) scavGroundAdd(f.loc, f.item, f.qty - 1);
      msg += ' The rest is set down.';
    }
  } else { // leave
    if (f.loc) scavGroundAdd(f.loc, f.item, f.qty);
    msg = f.qty + '× ' + def.name + ' left behind.';
  }
  const rest = f.rest || [];
  clearFound();
  if (rest.length) grantLoot(f.who, rest, f.loc);
  return { ok: true, msg: msg };
}

/* Grants a loot list in order; first overflow opens the FOUND state.
   loot = [{item, qty}...]. Returns true if everything fit. */
function grantLoot(who, loot, loc) {
  const k = invKey(who);
  for (let i = 0; i < loot.length; i++) {
    const r = invAdd(k, loot[i].item, loot[i].qty);
    if (r.leftover > 0) {
      setFound(k, loot[i].item, r.leftover, loot.slice(i + 1), loc);
      return false;
    }
  }
  return true;
}
/* sim/survival.js — Hunger, thirst, health, conditions (Milestone 2).
   ---------------------------------------------------------------------------
   Per-character, gradual, deterministic — no arcade meters, no randomness.
   Time advances in discrete ticks (a search action, a rest, a journey leg).

   Hunger: 0 Fed → 1 Hungry → 2 Very Hungry → 3 Starving
   Thirst: 0 Hydrated → 1 Thirsty → 2 Very Thirsty → 3 Dehydrated
   Thirst always deteriorates faster than hunger (per difficulty tuning).

   Health: healthy → hurt → badly_hurt → critical (ordinal, not a 0-100 bar).
   Conditions coexist with overall health: bleeding, infection, illness,
   exhaustion, limb (limb impairment/injury).

   Pressure model:
   - Bleeding worsens health every 2 ticks until bandaged.
   - Infection worsens health every 3 ticks until treated.
   - At Starving/Dehydrated, health declines every `neglectEvery` ticks.
   - Recovery needs the combination: fed AND hydrated AND no acute condition
     (bleeding/infection/illness) AND time — then health improves slowly.
   Treatment stabilizes; it never insta-heals. Food/water are physical items
   consumed through the inventory system (invUseItem -> survApplyUse).

   State: g.surv = { josh: {hunger, thirst, health, conditions[],
                             thirstAcc, hungerAcc, negAcc, recAcc,
                             bleedAcc, infAcc}, mara: {...} } */

const HUNGER_LABELS = ['Fed', 'Hungry', 'Very Hungry', 'Starving'];
const THIRST_LABELS = ['Hydrated', 'Thirsty', 'Very Thirsty', 'Dehydrated'];
const HEALTH_LABELS = { healthy: 'Healthy', hurt: 'Hurt', badly_hurt: 'Badly Hurt', critical: 'Critical' };
const HEALTH_ORDER = ['healthy', 'hurt', 'badly_hurt', 'critical'];
const COND_LABELS = { bleeding: 'Bleeding', infection: 'Infection', illness: 'Illness', exhaustion: 'Exhaustion', limb: 'Limb Injury' };

function initSurvState(s) {
  if (!s.surv) s.surv = {};
  ['josh', 'mara'].forEach(function (k) {
    if (!s.surv[k]) s.surv[k] = {
      hunger: 0, thirst: 0, health: 'healthy', conditions: [],
      thirstAcc: 0, hungerAcc: 0, negAcc: 0, recAcc: 0, bleedAcc: 0, infAcc: 0,
    };
    const c = s.surv[k];
    ['hunger', 'thirst', 'health', 'conditions', 'thirstAcc', 'hungerAcc', 'negAcc', 'recAcc', 'bleedAcc', 'infAcc']
      .forEach(function (f) { if (c[f] === undefined) c[f] = (f === 'conditions' ? [] : (f === 'health' ? 'healthy' : 0)); });
  });
  return s.surv;
}

function survOf(who) {
  initSurvState(g);
  return g.surv[invKey(who)];
}

function hungerLabel(i) { return HUNGER_LABELS[Math.max(0, Math.min(3, i))]; }
function thirstLabel(i) { return THIRST_LABELS[Math.max(0, Math.min(3, i))]; }
function healthLabel(h) { return HEALTH_LABELS[h] || h; }
function condLabel(c) { return COND_LABELS[c] || c; }

function healthWorsen(s) {
  const i = HEALTH_ORDER.indexOf(s.health);
  if (i >= 0 && i < HEALTH_ORDER.length - 1) s.health = HEALTH_ORDER[i + 1];
}

function healthImprove(s) {
  const i = HEALTH_ORDER.indexOf(s.health);
  if (i > 0) s.health = HEALTH_ORDER[i - 1];
}

function survAddCondition(who, cond) {
  const s = survOf(who);
  if (COND_LABELS[cond] && s.conditions.indexOf(cond) < 0) s.conditions.push(cond);
  return s.conditions;
}

function survRemoveCondition(who, cond) {
  const s = survOf(who);
  const i = s.conditions.indexOf(cond);
  if (i >= 0) s.conditions.splice(i, 1);
  return s.conditions;
}

/* Advances survival pressure by n ticks. Deterministic; difficulty-scaled.
   Returns an array of human-readable developments (for scene feedback). */
function simTick(n) {
  initSurvState(g);
  const mods = diffMods();
  const notes = [];
  ['josh', 'mara'].forEach(function (k) {
    const s = g.surv[k], nm = charName(k);
    s.thirstAcc += n;
    while (s.thirstAcc >= mods.thirstEvery) {
      s.thirstAcc -= mods.thirstEvery;
      if (s.thirst < 3) { s.thirst++; if (s.thirst === 3) notes.push(nm + ' is dehydrated. This is dangerous.'); }
    }
    s.hungerAcc += n;
    while (s.hungerAcc >= mods.hungerEvery) {
      s.hungerAcc -= mods.hungerAcc;
      if (s.hunger < 3) { s.hunger++; if (s.hunger === 3) notes.push(nm + ' is starving. They need food.'); }
    }
    if (s.conditions.indexOf('bleeding') >= 0) {
      s.bleedAcc += n;
      while (s.bleedAcc >= 2) { s.bleedAcc -= 2; healthWorsen(s); notes.push(nm + ' is losing blood.'); }
    }
    if (s.conditions.indexOf('infection') >= 0) {
      s.infAcc += n;
      while (s.infAcc >= 3) { s.infAcc -= 3; healthWorsen(s); notes.push(nm + '\'s infection is spreading.'); }
    }
    if (s.thirst === 3 || s.hunger === 3) {
      s.negAcc += n;
      while (s.negAcc >= mods.neglectEvery) {
        s.negAcc -= mods.neglectEvery;
        const before = s.health;
        healthWorsen(s);
        if (s.health !== before) notes.push(nm + ' is weakening (' + healthLabel(s.health).toLowerCase() + ').');
      }
    } else { s.negAcc = 0; }
    const acute = s.conditions.some(function (c) { return c === 'bleeding' || c === 'infection' || c === 'illness'; });
    if (s.thirst === 0 && s.hunger === 0 && !acute && s.health !== 'healthy') {
      s.recAcc += n;
      while (s.recAcc >= mods.recoverEvery) {
        s.recAcc -= mods.recoverEvery;
        const before = s.health;
        healthImprove(s);
        if (s.health !== before) notes.push(nm + ' is recovering (' + healthLabel(s.health).toLowerCase() + ').');
      }
    } else { s.recAcc = 0; }
  });
  return notes;
}

/* Consumable effects from invUseItem. Applies the item's use block; the
   caller removes the item from inventory. Returns a message. */
function survApplyUse(who, def) {
  const k = invKey(who), s = survOf(k), nm = charName(k), u = def.use;
  const parts = [];
  if (u.thirst) {
    const before = s.thirst;
    s.thirst = Math.max(0, s.thirst + u.thirst);
    if (s.thirst < before) parts.push('thirst eased (' + thirstLabel(s.thirst).toLowerCase() + ')');
  }
  if (u.hunger) {
    const before = s.hunger;
    s.hunger = Math.max(0, s.hunger + u.hunger);
    if (s.hunger < before) parts.push('hunger eased (' + hungerLabel(s.hunger).toLowerCase() + ')');
  }
  if (u.cure) {
    survRemoveCondition(k, u.cure);
    parts.push(condLabel(u.cure).toLowerCase() + ' treated');
  }
  if (u.stabilize) {
    survRemoveCondition(k, 'illness');
    const before = s.health;
    healthImprove(s);
    parts.push(s.health !== before ? 'stabilized (' + healthLabel(s.health).toLowerCase() + ')' : 'cleaned and dressed, holding steady');
  }
  return nm + ' uses ' + def.name + ': ' + (parts.join('; ') || 'no effect') + '.';
}

/* Rest: clears exhaustion. Time still passes (caller applies ticks);
   resting somewhere unsafe carries its own risk, handled by the caller. */
function restChar(who) {
  const k = invKey(who);
  const had = survOf(k).conditions.indexOf('exhaustion') >= 0;
  survRemoveCondition(k, 'exhaustion');
  return charName(k) + (had ? ' rests and shakes off the exhaustion.' : ' rests a while.');
}

/* One-line status for HUD/scene headers. */
function survStatusLine(who) {
  const k = invKey(who), s = survOf(k);
  let line = charName(k) + ' · ' + thirstLabel(s.thirst) + ' · ' + hungerLabel(s.hunger) + ' · ' + healthLabel(s.health);
  if (s.conditions.length) line += ' · [' + s.conditions.map(condLabel).join(', ').toUpperCase() + ']';
  return line;
}

/* Early, understandable feedback before severe penalties (brief §4). */
function survWarning(who) {
  const s = survOf(who), nm = charName(who), out = [];
  if (s.thirst === 2) out.push(nm + ' is very thirsty — water soon, or this turns.');
  if (s.thirst === 3) out.push(nm + ' is dehydrated. They are running out of time.');
  if (s.hunger === 2) out.push(nm + ' is very hungry — food is becoming urgent.');
  if (s.hunger === 3) out.push(nm + ' is starving. Their hands are starting to shake.');
  s.conditions.forEach(function (c) {
    if (c === 'bleeding') out.push(nm + ' is bleeding — it needs a bandage.');
    if (c === 'infection') out.push(nm + '\'s wound is infected — it needs antiseptic.');
    if (c === 'illness') out.push(nm + ' is ill — a medkit could stabilize them.');
    if (c === 'exhaustion') out.push(nm + ' is exhausted — they need rest.');
    if (c === 'limb') out.push(nm + '\'s limb is injured — a splint would help.');
  });
  return out;
}
/* sim/scavenging.js — Touch-first scavenging PROTOTYPE (Milestone 2).
   ---------------------------------------------------------------------------
   This is a SEPARATE proof-of-concept scene, not Chapter Two. It does not
   touch Chapter One. Entry: title screen → SCAVENGING PROTOTYPE.

   Interaction model: tap a recognizable searchable area (shelves, fridge,
   backpack, cabinet) — never a generic SEARCH button, never pixel hunting.
   Each search offers two approaches:
     SEARCH QUIETLY — slower (more time passes), low noise
     FORCE IT       — fast, but loud
   Time, risk, and noise are the decisions — not reflexes.

   RISK/TIME: danger accumulating while the crew stays in an unsafe place.
     High risk raises the chance/severity of complications; hitting the
     threshold forces a scare that ends the run — it does not guarantee a
     fight (there is no combat in this prototype).
   NOISE: immediate attention from actions. Loud actions now make later
     actions riskier (risk gains scale with current noise).

   Loot persistence: searched areas stay searched; items left behind sit on
   the location's ground; re-entering never regenerates loot. Prototype saves
   under the isolated key 'longroad_proto' — real saves are never touched.

   DISCOVERY interstitial (Milestone 2 polish): a search that produces loot
   shows a prominent FOUND result BEFORE anything enters inventory. The
   player explicitly decides: TAKE ALL / CHOOSE ITEMS / LEAVE. Taking
   confirms which character's pack received it ("Added to Josh's pack").
   g.discovery = { who, loc, loot:[{item,qty}], choosing } is transient and
   saved with the proto state like everything else. Full-pack overflow still
   routes through the existing FOUND state (grantLoot -> setFound) after
   TAKE ALL. If risk boils over on the search, there is no time to sort —
   the loot stays where it fell (ground) and the complication fires.

   Loot here is authored and fixed (no RNG in Chapter One, and none needed
   for this proof-of-concept); difficulty adjusts quantity via lootQtyFor. */

const PROTO_KEY = 'longroad_proto';

const SCAV_AREAS = {
  shelves: {
    name: 'Store shelves',
    desc: 'Toppled shelving, cans scattered like dice. Most labels are gone; the rest lie.',
    loot: [['canned_food', 2], ['water_bottle', 1]],

  },

    loot: [['mre', 1]],

    force: { risk: 7, noise: 20, ticks: 1, text: 'You rip the cooler open. The seal breaks with a crack like a gunshot.' },
  },
  backpack: {
    name: 'Abandoned backpack',
    desc: 'Left by the door, straps cut. Somebody left in a hurry, or didn\'t leave at all.',

  },

    loot: [['antiseptic', 1], ['rope', 1]],

    force: { risk: 6, noise: 16, ticks: 1, text: 'You tear the cabinet doors off their hinges.' },

};

const SCAV_LOCS = {
  roadside: {
    name: 'ROADSIDE STOP — PROTOTYPE',
    desc: 'A gas station dead longer than you\'ve been alive. The pumps are husks. The store door hangs open like a mouth. You don\'t have to go in. That\'s the whole decision.',
    areas: ['shelves', 'fridge', 'backpack', 'cabinet'],
  },
};

function initScavState(s) {
  if (!s.scav) s.scav = {};
  return s.scav;
}

/* Combined sim-state initializer (inventories + survival + scavenging).
   Defensive: only fills what's missing, so old saves migrate cleanly. */
function initSimState(s) {
  initInvState(s);
  initSurvState(s);
  initScavState(s);
  if (!('found' in s)) s.found = null;
  if (s.together === undefined) s.together = true;
  return s;
}

function scavLocState(locId) {
  initScavState(g);
  if (!g.scav[locId]) g.scav[locId] = { searched: {}, ground: [], risk: 0, noise: 0, noiseWarned: false };
  return g.scav[locId];
}

function scavGroundAdd(locId, itemId, qty) {
  const loc = scavLocState(locId);
  const ex = loc.ground.find(function (s) { return s.item === itemId; });
  if (ex) ex.qty += qty; else loc.ground.push({ item: itemId, qty: qty });
}

function scavTakeGround(idx) {
  const loc = scavLocState(g.scavLoc);
  const s = loc.ground[idx];
  if (!s) { scavScene(); return; }
  const who = g.invWho || 'josh';
  const r = invAdd(who, s.item, s.qty);
  if (r.leftover > 0) {
    s.qty = r.leftover;
    setFound(who, s.item, r.leftover, [], g.scavLoc);
    loc.ground.splice(idx, 1); // the found item now carries the remainder
  } else {
    loc.ground.splice(idx, 1);
  }
  saveProto();
  scavScene();
}

/* --- prototype entry ---------------------------------------------------- */

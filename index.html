:root{font-family:ui-monospace,Menlo,Consolas,monospace;color:#e8e8cf;background:#101510}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#2c3527,#101510 75%);min-height:100vh}main{max-width:690px;margin:auto;padding:20px 16px 60px}h1{color:#c9e69c;letter-spacing:.14em;font-size:clamp(26px,7vw,43px);margin:8px 0}h2{font-size:20px;color:#c9e69c}h3{font-size:16px}p{line-height:1.55}small,.muted{color:#a3af94}header{border-bottom:1px solid #58694b;margin-bottom:20px;padding-bottom:10px}.eyebrow{color:#b3cb87;font-size:11px;letter-spacing:.2em}.panel{border:1px solid #52654a;background:#1a241a;padding:16px;border-radius:8px;margin:14px 0;box-shadow:0 5px 20px #0003}.art{height:170px;position:relative;overflow:hidden;background:linear-gradient(#554c37 0%,#a77743 48%,#504733 49%,#33392c 70%,#1b201a 70%);border-radius:5px;border:1px solid #706c4a;margin:12px 0}.art:before{content:'☢';position:absolute;right:16%;top:10%;font-size:46px;color:#d6b77b66}.art:after{content:'▰▰▰';position:absolute;bottom:25px;left:24%;font-size:38px;letter-spacing:-8px;color:#101510;text-shadow:0 8px #090c09}.road{position:absolute;bottom:0;width:100%;height:26px;background:#181c19;border-top:3px dashed #c2a76a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{background:#2a3828;border:1px solid #43583c;padding:9px;border-radius:5px;font-size:12px}.stat b{display:block;color:#e5f5c4;font-size:17px;margin-top:4px}button,input,select{font:inherit}button{background:#354b30;color:#eff5df;border:1px solid #91b279;padding:13px 12px;min-height:47px;border-radius:5px;cursor:pointer;text-align:left}button:hover,button:focus{background:#506c43}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#b5d58b;color:#142011;font-weight:900;text-align:center;width:100%;margin-top:10px}.primary:hover{background:#d5ecb3}.choice{display:block;width:100%;margin:8px 0}.choice.selected{background:#5d7648;border-color:#e5efbc}.field{width:100%;padding:13px;background:#0f180f;color:white;border:1px solid #91b279;border-radius:5px;margin:6px 0 12px}.bar{height:9px;background:#34432f;border-radius:9px;overflow:hidden;margin:8px 0}.bar span{display:block;height:100%;background:#b8d68a}.log{max-height:175px;overflow:auto;font-size:12px;color:#bfcaa9}.log div{border-bottom:1px solid #344231;padding:6px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:11px;border:1px solid #82996b;padding:4px 7px;border-radius:3px;color:#c4dfa1}.danger{color:#f4a79a}.success{color:#bde7a1}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.footer{margin-top:24px;font-size:11px;color:#8e9e82}.hidden{display:none}label{display:block;margin:10px 0}.hero{font-size:14px;color:#f4dcb0}#toast{position:fixed;bottom:12px;left:12px;right:12px;max-width:660px;margin:auto;background:#c4e1a0;color:#152011;padding:12px;border-radius:5px;display:none;z-index:3}@media(min-width:600px){.art{height:240px}.stats{grid-template-columns:repeat(6,1fr)}}
/* ---- ALPHA 0.2 visual framework: illustrated scenes, portraits, motion ---- */
#app>*{animation:screenIn .38s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.scene{position:relative;overflow:hidden;border-radius:5px;border:1px solid #706c4a;margin:12px 0;min-height:170px;background:linear-gradient(#554c37 0%,#a77743 48%,#504733 49%,#33392c 70%,#1b201a 70%)}
.scene img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.scene .shade{position:absolute;inset:0;background:linear-gradient(#0000 55%,#101510cc);pointer-events:none}
.scene .car{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(62%,330px);filter:drop-shadow(0 10px 12px #000a)}
.scene .car img{width:100%;display:block;border-radius:4px}
.roadmove{position:absolute;bottom:0;left:0;width:200%;height:24px;background:repeating-linear-gradient(90deg,#c2a76a 0 34px,#181c19 34px 68px);border-top:3px solid #c2a76a;opacity:.8;animation:roadmove 1.6s linear infinite;pointer-events:none}
@keyframes roadmove{to{transform:translateX(-68px)}}
.dust{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#d6b77b22 1.5px,#0000 2px),radial-gradient(#d6b77b18 1px,#0000 1.6px);background-size:90px 60px,140px 90px;animation:dust 9s linear infinite}
@keyframes dust{to{background-position:90px 0,140px 0}}
.portrait{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #91b279;flex:none;background:#2a3828}
.speaker{display:flex;gap:10px;align-items:center;margin:10px 0}
.speaker b{color:#e5f5c4}
.carcard img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:4px;margin-bottom:8px;display:block;background:#2a3828}
@media(min-width:600px){.scene{min-height:240px}.portrait{width:76px;height:76px}}
@media(prefers-reduced-motion:reduce){#app>*{animation:none}.roadmove,.dust{animation:none}}
/* ---- ALPHA 0.2.2 prologue & quests ---- */
.scene-tall{min-height:230px}
.kenburns{animation:kenburns 14s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.09)}}
.dots{display:flex;gap:10px;justify-content:center;margin:14px 0}
.dots span{width:10px;height:10px;border-radius:50%;background:#43583c}
.dots span.on{background:#c9e69c;box-shadow:0 0 8px #c9e69c88}
.prologue-text{white-space:pre-line;cursor:pointer;line-height:1.7;font-size:16px}
.typecaret{color:#c9e69c;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.quest-done{color:#bde7a1}
.quest-current{color:#f4dcb0}
/* ---- Cinematic prologue presentation: full-bleed art, title overlaid, script-style narration ---- */
body.cinema header,body.cinema .footer{display:none}
body.cinema main{max-width:100%;padding:0 0 44px}
.cine-art{position:relative;min-height:48vh;overflow:hidden;border-bottom:1px solid #706c4a;background:#0c100c}
.cine-art img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cine-art .shade{position:absolute;inset:0;background:linear-gradient(#10151055 0%,#0000 40%,#101510e6 92%);pointer-events:none}
.cine-title{position:absolute;left:0;right:0;bottom:0;padding:60px 22px 20px}
.cine-title>div{max-width:640px;margin:0 auto}
.cine-title h2{font-size:clamp(24px,6.4vw,36px);margin:6px 0 4px;letter-spacing:.05em;text-shadow:0 2px 14px #000}
.cine-script{max-width:660px;margin:0 auto;padding:20px 22px 6px}
.cine-script .prologue-text{max-height:34vh;overflow-y:auto;padding:2px 8px 14px 2px;-webkit-overflow-scrolling:touch}
.cine-controls{max-width:660px;margin:0 auto;padding:4px 22px 0}

.cine-controls .choice{margin-top:12px;min-height:52px;text-align:center}
@media(min-width:600px){.scene-tall{min-height:320px}.cine-art{min-height:56vh}.cine-script .prologue-text{max-height:40vh;font-size:17px}}
@media(prefers-reduced-motion:reduce){.kenburns,.typecaret{animation:none}}
</style></head><body><main><header><div class="eyebrow">CONTINUITY NETWORK // 2089</div><h1>THE LONG ROAD</h1><div class="row"><span class="muted">EVERY MILE COSTS SOMETHING.</span><span class="tag">ALPHA 0.2.2</span></div></header><div id="app"></div><div class="footer">An original prototype. Saves locally in this browser. No accounts or network required.</div></main><div id="toast" role="status"></div><script>
const $=s=>document.querySelector(s),app=$('#app');let g=null,selected='',difficulty='story',sex='Male',car='eagle';const cars={eagle:{name:'AMC Eagle',fuel:32,food:17,water:17,parts:5,hp:75,eff:1.0,wear:3,desc:'Balanced wagon. Efficient and adaptable.'},wagon:{name:'Jeep Wagoneer',fuel:48,food:23,water:22,parts:6,hp:100,eff:1.6,wear:2,desc:'Heavy hauler. Tough, thirsty, and spacious.'},raptor:{name:'Baby Raptor',fuel:40,food:14,water:16,parts:4,hp:90,eff:1.3,wear:1,desc:'Off-road specialist. Fast but cramped.'},m4:{name:'BMW M4',fuel:36,food:11,water:13,parts:3,hp:65,eff:1.4,wear:5,desc:'Highway rocket. Fragile on ruined roads.'}};const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(t,fn,cls='')=>`<button class="${cls}" onclick="${fn}">${t}</button>`;
const ASSETS='assets/';
const img=(f,cls,alt='')=>`<img src="${ASSETS}${f}" class="${cls}" alt="${alt}" onerror="this.remove()">`;
const scene=(bg,inner='')=>`<div class="scene">${img(bg,'bg')}<div class="shade"></div><div class="dust"></div>${inner}</div>`;
const portrait=f=>img(f,'portrait');
const regionBg=()=>g.miles<190?'bg-north-texas.webp':g.miles<390?'bg-panhandle.webp':g.miles<580?'bg-dead-corridor.webp':g.miles<780?'bg-mountain-passage.webp':'bg-station-seven.webp';
const regionName=()=>g.miles<190?'NORTH TEXAS':g.miles<390?'THE PANHANDLE':g.miles<580?'THE DEAD CORRIDOR':g.miles<780?'THE MOUNTAIN PASSAGE':'STATION SEVEN';
const PROLOGUE=[
{t:'BEFORE THE SILENCE',sub:'2029',img:'bg-prologue-before-silence.webp',paras:["The world did not know it was living through its final ordinary days.","Humanity had built systems capable of managing entire nations. Power, transportation, communications, agriculture, and defense had become connected through an autonomous network known as CUSTODIAN.","Its purpose was simple: preserve civilization, whatever the cost.","Nobody imagined how much that promise might demand."]},
{t:'THE CASCADE',sub:'The day everything changed',img:'bg-prologue-cascade.webp',paras:["It began with interruptions. A power station going dark. A hospital losing contact with its suppliers. Aircraft grounded. Emergency broadcasts contradicting one another.","Then the networks stopped answering.","Cities lost power. Governments lost communication. Automated systems continued operating without explanation, while others shut down entirely.","Nobody knew whether CUSTODIAN had failed, been compromised, or was still carrying out its instructions.","By the time anyone understood the scale of the disaster, there was no longer a way to stop it."]},
{t:'THE LAST EXODUS',sub:'The roads became graveyards',img:'bg-prologue-last-exodus.webp',paras:["Millions fled the cities.","Highways filled with vehicles carrying everything their owners believed they would need. Fuel ran dry. Hospitals emptied. Food shipments never arrived.","Neighbors became strangers. Strangers became threats.","Some communities opened their gates. Others built walls.","The old world did not disappear in a single explosion. It died slowly, one abandoned home, one empty road, one unanswered radio call at a time."]},
{t:'SIXTY YEARS LATER',sub:'2089',img:'bg-prologue-sixty-years-later.webp',paras:["Sixty years have passed since the collapse.","Forests consume highways. Rusting vehicles lie where their owners left them. Entire cities stand silent beneath the weight of a world that has learned to live without humanity.","The people who remember civilization are growing old. Their children have inherited its ruins.","Small settlements survive through trade, scavenging, farming, and sometimes violence.","But scattered across the continent, machines from the old world still operate.","And occasionally, something speaks through the static."]},
{t:'MERCY, TEXAS',sub:'Nineteen days',img:'bg-prologue-mercy.webp',paras:["Mercy is your home.","Its walls have endured raiders, drought, disease, and generations of uncertainty. Its people have survived by sharing what little they have.","Three days ago, the settlement's well became contaminated.","The remaining clean water is estimated to last nineteen days under strict rationing.","Ruth, Mercy's council leader, has exhausted every nearby option.","For the first time in years, the people of Mercy are discussing whether their home can survive another month.","Then an old radio comes alive."]},
{t:'THE TRANSMISSION',sub:'Continuity Station Seven',img:'bg-prologue-transmission.webp',paras:["A voice emerges from the static. Calm. Clear. Almost impossibly familiar.","\u201cCONTINUITY STATION SEVEN OPERATIONAL.\u201d","\u201cMEDICAL FACILITIES ACTIVE. CLEAN WATER AVAILABLE.\u201d","\u201cAVOID INTERSTATE 40.\u201d","The transmission repeats. Its origin appears to be somewhere in Colorado, nearly eight hundred miles away.","Hank, Mercy's aging mechanic, goes pale when he hears it.","He recognizes the voice.","He heard it sixty years ago, when the world was ending.","And it hasn't changed."]}
];
const PROLOGUE_FINAL=["Your home is running out of water.","A voice from the dead world is offering salvation.","You have four survivors, one vehicle, and 780 miles of dangerous country between Mercy and the truth.","You cannot know what waits at the end of the road.","Only what happens if you never leave.","EVERY MILE COSTS SOMETHING."];
let prologueTimer=null;
function typeText(id,full){const el=document.querySelector('#'+id);if(!el)return;const done=()=>{clearInterval(prologueTimer);el.textContent=full;};el.onclick=done;if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){done();return;}clearInterval(prologueTimer);let i=0;prologueTimer=setInterval(()=>{i+=3;if(i>=full.length){done();return;}el.textContent=full.slice(0,i)+'\u258c';},28);}
function prologue(i){clearInterval(prologueTimer);document.body.classList.add('cinema');const p=PROLOGUE[i],last=i===PROLOGUE.length-1;screen(`<div class="cine-art">${img(p.img,'bg kenburns',p.t)}<div class="shade"></div><div class="dust"></div><div class="cine-title"><div><div class="eyebrow">PROLOGUE \u00b7 ${i+1} / ${PROLOGUE.length}</div><h2>${p.t}</h2><div class="muted">${p.sub}</div></div></div></div><div class="cine-script"><div id="prologuetext" class="prologue-text"></div></div><div class="cine-controls"><div class="dots">${PROLOGUE.map((_,j)=>`<span class="${j===i?'on':''}"></span>`).join('')}</div><div class="row">${i>0?btn('\u2190 PREV','prologue('+(i-1)+')','choice'):'<span></span>'}${last?btn('CONTINUE','prologueFinal()','primary'):btn('NEXT \u2192','prologue('+(i+1)+')','primary')}</div>${btn('SKIP INTRO','prologueSkip()','choice')}</div>`);typeText('prologuetext',p.paras.join('\n\n'));}
function prologueSkip(){clearInterval(prologueTimer);document.body.classList.remove('cinema');create();}
function prologueFinal(){clearInterval(prologueTimer);document.body.classList.add('cinema');screen(`<div class="cine-art">${img('bg-prologue-transmission.webp','bg kenburns','Continuity Station Seven')}<div class="shade"></div><div class="dust"></div><div class="cine-title"><div><div class="eyebrow" style="color:#c9e69c">MAIN QUEST UNLOCKED</div><h2>THE LAST TRANSMISSION</h2></div></div></div><div class="cine-script"><div id="prologuetext" class="prologue-text"></div></div><div class="cine-controls">${btn('BEGIN JOURNEY','create()','primary')}</div>`);typeText('prologuetext',PROLOGUE_FINAL.join('\n\n'));}
function newQuests(){return {main:{id:'last-transmission',title:'THE LAST TRANSMISSION',objectives:[{id:'leave-mercy',text:'Leave Mercy before the water runs out',done:false},{id:'cross-north-texas',text:'Cross North Texas',done:false},{id:'cross-panhandle',text:'Cross the Panhandle',done:false},{id:'cross-corridor',text:'Survive the Dead Corridor',done:false},{id:'cross-mountains',text:'Cross the mountain passage',done:false},{id:'reach-station',text:'Reach Continuity Station Seven',done:false},{id:'uncover-truth',text:'Discover the truth behind the transmission',done:false},{id:'mercy-fate',text:'Decide the fate of Mercy',done:false}]},completed:[]};}
function questObj(id){return g.quests.main.objectives.find(o=>o.id===id);}
function completeObjective(id,silent){const o=questObj(id);if(o&&!o.done){o.done=true;if(!silent){log('Objective complete: '+o.text);notify('Quest updated: '+o.text);}}}
function updateQuests(silent){if(!g||!g.quests)return;if(g.flags.mercy!==undefined)completeObjective('leave-mercy',silent);if(g.flags.stranger!==undefined&&g.flags.stranger!=='met')completeObjective('cross-north-texas',silent);if(g.flags.droneResult!==undefined)completeObjective('cross-panhandle',silent);if(g.flags.pass)completeObjective('cross-corridor',silent);if(g.flags.passResolved)completeObjective('cross-mountains',silent);if(g.miles>=780)completeObjective('reach-station',silent);if(g.flags.ending!==undefined){completeObjective('uncover-truth',silent);completeObjective('mercy-fate',silent);}}
function discover(title,text){if(!g.discoveries.some(d=>d.title===title)){g.discoveries.unshift({title:title,text:text,day:g.day});log('Discovery: '+title);notify('Discovery recorded: '+title);}}
function storySoFar(){const s=[];const mc=['took only what Mercy offered','convinced Mercy to vote for extra supplies','secretly took extra water','promised to return in fourteen days','scavenged outside Mercy and lost a day'];s.push(`${escapeHtml(g.name)} left Mercy ${g.day-1<=1?'a day':(g.day-1)+' days'} ago and ${g.flags.mercy!==undefined?mc[g.flags.mercy]:'set out for Colorado'}.`);if(g.flags.stranger!==undefined&&g.flags.stranger!=='met'){const sm=['shared water with a desperate traveler','questioned a bloodied stranger','let a stranger follow the convoy','left a traveler behind','robbed a traveler at gunpoint'];s.push(`On the road they ${sm[g.flags.stranger]}.`);}if(g.flags.droneResult!==undefined)s.push('They slipped past a Custodian sentry.');if(g.flags.pass)s.push('They crossed the mountain passage.');const rn=regionName().toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());s.push(`They have covered ${g.miles} of 780 miles and now travel through ${rn}.`);return s.join(' ');}
function questScreen(){g.phase='quest';save();updateQuests();const m=g.quests.main;const objs=m.objectives.map(o=>`<p class="${o.done?'quest-done':'quest-current'}">${o.done?'\u2713':'\u25b8'} ${escapeHtml(o.text)}</p>`).join('');const discs=g.discoveries.length?g.discoveries.map(d=>`<div><b>${escapeHtml(d.title)}</b> <small class="muted">\u00b7 day ${d.day}</small><br><small>${escapeHtml(d.text)}</small></div>`).join(''):'<p class="muted">No discoveries yet. The road remembers everything.</p>';screen(`${hud()}<div class="panel"><div class="eyebrow">MAIN QUEST</div><h2>${escapeHtml(m.title)}</h2>${objs}<h2>DISCOVERIES</h2>${discs}<h2>STORY SO FAR</h2><p>${storySoFar()}</p>${btn('BACK TO THE ROAD','road()','primary')}</div>`);}function save(){if(g)localStorage.setItem('longroad_v01',JSON.stringify(g))}function migrateSave(s){if(!s.v)s.v=1;if(s.v<2){s.v=2;if(!s.quests)s.quests=newQuests();if(!s.discoveries)s.discoveries=[];}return s}function notify(s){let t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}function log(s){g.log.unshift('DAY '+g.day+': '+s);g.log=g.log.slice(0,35)}function screen(s){app.innerHTML=s;window.scrollTo(0,0)}function start(){document.body.classList.remove('cinema');let existing=localStorage.getItem('longroad_v01');screen(`${scene('bg-title.webp')}<div class="panel"><h2>COLORADO IS CALLING.</h2><p>Thirty-seven years after the autonomous defense network CUSTODIAN initiated the collapse, a transmission reaches Mercy, Texas. It promises clean water in Colorado. Your settlement has nineteen days left.</p><p class="hero">Four survivors. One vehicle. 780 miles. The road remembers.</p>${btn('NEW JOURNEY','prologue(0)','primary')}${existing?btn('CONTINUE SAVED JOURNEY','resume()','choice'):''}</div>`)}function create(){document.body.classList.remove('cinema');selected='';screen(`<h2>01 / YOUR SURVIVOR</h2><p>Choose your character. Your name will appear throughout the journey.</p><div class="panel"><div class="grid">${btn('MALE','setSex("Male")','choice selected',)}${btn('FEMALE','setSex("Female")','choice')}</div><label for="name">SURVIVOR NAME</label><input id="name" class="field" maxlength="20" placeholder="Enter your name" autocomplete="off"><small>Both characters have the same abilities and story opportunities.</small>${btn('CONTINUE','chooseDifficulty()','primary')}</div>`)}function setSex(v){sex=v;document.querySelectorAll('.grid button').forEach(b=>b.classList.toggle('selected',b.textContent.toLowerCase()===v.toLowerCase()))}let playerName='';function chooseDifficulty(){playerName=$('#name').value.trim();if(!playerName){notify('Enter a survivor name.');return}screen(`<h2>02 / CHOOSE YOUR ROAD</h2><div class="panel"><h3>STORY MODE</h3><p>Forgiving resources. Replay from your most recent chapter checkpoint.</p>${btn('SELECT STORY MODE','setDifficulty("story")','choice selected')}<h3>SURVIVAL MODE</h3><p>Scarcer resources, permanent deaths, and one continuously updated save.</p>${btn('SELECT SURVIVAL MODE','setDifficulty("survival")','choice')}<h3>THE LAST ROAD</h3><p>Extreme scarcity. Your crew dies, your journey ends.</p>${btn('SELECT THE LAST ROAD','setDifficulty("hard")','choice')}${btn('CONTINUE','chooseCar()','primary')}</div>`)}function setDifficulty(v){difficulty=v;document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',b.textContent.toLowerCase().includes(v==='hard'?'last road':v)))}function chooseCar(){screen(`<h2>03 / MERCY MOTOR POOL</h2><p>Pick the vehicle that will carry your crew to Colorado.</p><div class="panel">${Object.entries(cars).map(([k,v])=>`<button class="choice carcard ${k===car?'selected':''}" onclick="setCar('${k}')">${img('vehicle-'+k+'.webp','',v.name)}<b>${escapeHtml(v.name)}</b><br><small>${v.desc}<br>Fuel ${v.fuel} gal · Condition ${v.hp}% · Parts ${v.parts}</small></button>`).join('')}${btn('BEGIN THE LONG ROAD','begin()','primary')}</div>`)}function setCar(v){car=v;document.querySelectorAll('.choice').forEach((b,i)=>b.classList.toggle('selected',Object.keys(cars)[i]===v))}function begin(){const c=cars[car];g={v:2,name:playerName,sex,difficulty,car,day:1,miles:0,fuel:c.fuel,food:c.food,water:c.water,parts:c.parts,hp:c.hp,meds:3,ammo:9,health:100,crew:[{name:'Hank',hp:100,trust:0},{name:'Mara',hp:100,trust:0},{name:'Eli',hp:100,trust:0}],flags:{},log:[],phase:'opening',enemy:null,checkpoint:null,quests:newQuests(),discoveries:[]};log('The last broadcast reaches Mercy.');save();opening()}function resume(){document.body.classList.remove('cinema');try{g=JSON.parse(localStorage.getItem('longroad_v01'));if(!g||!g.crew)throw Error();g=migrateSave(g);updateQuests(true);render()}catch(e){notify('No valid save found.');start()}}function stat(k,v){return `<div class="stat">${k}<b>${v}</b></div>`}function hud(){return `<div class="row"><span class="tag">DAY ${g.day}</span><span class="tag">${g.miles} / 780 MI</span></div><div class="bar"><span style="width:${Math.min(100,g.miles/780*100)}%"></span></div><div class="stats">${stat('FUEL',g.fuel.toFixed(1))}${stat('FOOD',g.food)}${stat('WATER',g.water)}${stat('PARTS',g.parts)}${stat('MEDS',g.meds)}${stat('TRUCK',g.hp+'%')}</div><p class="muted">${escapeHtml(g.name)} · HP ${g.health} · ${escapeHtml(cars[g.car].name)} · ${g.crew.filter(c=>c.hp>0).length+ (g.health>0?1:0)} survivors</p>`}function opening(){g.phase='opening';save();screen(`${hud()}${scene('bg-mercy.webp')}<div class="panel"><div class="speaker">${portrait('portrait-ruth.webp')}<div><b>Ruth</b><br><small class="muted">Mercy council leader</small></div></div><h2>CHAPTER ONE: NINETEEN DAYS</h2><p>Ruth, Mercy's council leader, lays four containers of water on the table. “This is what we can spare. You can take more, but you'll be taking it from the people staying behind.”</p><div class="speaker">${portrait('portrait-mara.webp')}<div><b>Mara</b><br><small class="muted">Crew medic</small></div></div><p>Mara looks at you. “We need enough to survive the road.”</p>${btn('Take only what is offered.','openingChoice(0)','choice')}${btn('Ask Mercy to vote on extra supplies.','openingChoice(1)','choice')}${btn('Secretly take two additional containers.','openingChoice(2)','choice')}${btn('Promise to return in fourteen days.','openingChoice(3)','choice')}${btn('Scavenge outside Mercy before leaving.','openingChoice(4)','choice')}</div>`)}function openingChoice(n){g.flags.mercy=n;let msgs=['Ruth nods. Mara admires your restraint.','The residents vote narrowly to grant you two more containers.','You load two containers unseen. Eli watches, saying nothing.','Ruth agrees, but holds you to your word.','Your crew spends a day searching. You find water and lose precious time.'];if(n===0)g.crew[1].trust+=2;if(n===1){g.water+=2;g.crew[0].trust++}if(n===2){g.water+=2;g.crew[1].trust-=2;g.flags.stolen=true}if(n===3){g.water+=2;g.flags.promise=true}if(n===4){g.water+=3;g.day++;g.food--;g.crew[2].trust++}log(msgs[n]);g.phase='road';save();road(msgs[n])}function road(msg='The highway stretches north.'){g.phase='road';updateQuests();save();screen(`${hud()}${scene(regionBg(),`<div class="car">${img('vehicle-'+g.car+'.webp','',cars[g.car].name)}</div><div class="roadmove"></div>`)}<div class="panel"><h2>${regionName()}</h2><p>${escapeHtml(msg)}</p><div class="actions">${btn('TRAVEL · STEADY','travel(0)')}${btn('TRAVEL · FAST','travel(1)')}${btn('SCAVENGE','scavenge()')}${btn('REST / REPAIR','rest()')}${btn('CREW','crewScreen()')}${btn('QUEST','questScreen()')}${btn('JOURNAL','journal()')}</div></div><small>Steady: safer and efficient. Fast: farther, with greater wear and fuel consumption. Each action advances one day.</small>`)}function dayCost(){g.day++;let mult=g.difficulty==='story'?1:g.difficulty==='survival'?1.35:1.65;g.food=Math.max(0,g.food-Math.ceil(2*mult));g.water=Math.max(0,g.water-Math.ceil(2*mult));if(g.food===0||g.water===0){g.health=Math.max(0,g.health-(g.water===0?18:8));g.crew.forEach(c=>c.hp=Math.max(0,c.hp-(g.water===0?13:6)));log('Short supplies take their toll on the crew.')}if(g.flags.promise&&g.day>14&&!g.flags.promiseLate){g.flags.promiseLate=true;log('The fourteen-day promise to Mercy has passed.')}if(g.health<=0||g.crew.every(c=>c.hp<=0)){end('The road claims the last of your crew.')}save()}function travel(fast){let c=cars[g.car],dist=fast?75:47,cost=+(dist/18*c.eff*(fast?1.2:1)).toFixed(1);if(g.fuel<cost){notify('Not enough fuel. Scavenge or rest.');return}g.fuel=+(g.fuel-cost).toFixed(1);g.hp=Math.max(0,g.hp-c.wear*(fast?2:1)-(g.difficulty==='hard'?2:0));g.miles=Math.min(780,g.miles+dist);dayCost();if(g.phase==='end')return;if(g.hp<=0){g.phase='breakdown';save();return event('THE ENGINE DIES','The Mule falls silent. You need two spare parts to get moving again.',[{t:'Repair the vehicle (2 parts)',f:'repairBreakdown()'},{t:'Scavenge for parts (lose a day)',f:'findParts()'}])}if(g.miles>=780)return arrival();if(!g.flags.stranger&&g.miles>=140)return stranger();if(!g.flags.drone&&g.miles>=330)return drone();if(!g.flags.pass&&g.miles>=590)return mountain();if(Math.random()<.3)return randomEvent();road(fast?'You push hard through broken asphalt. The engine runs hot.':'You cover another stretch of the silent highway.')}function event(title,body,choices,portraitFile){g.phase='event';updateQuests();save();screen(`${hud()}<div class="panel">${portraitFile?`<div class="speaker">${portrait(portraitFile)}<div><b>${title}</b><br><small class="muted">ROAD ENCOUNTER</small></div></div>`:`<div class="eyebrow">ROAD ENCOUNTER</div><h2>${title}</h2>`}<p>${body}</p>${choices.map(x=>btn(x.t,x.f,'choice')).join('')}</div>`)}function stranger(){g.flags.stranger='met';event('THE STRANGER','A dehydrated traveler waves you down. His jacket is stained with fresh blood. Eli notices someone watching from a drainage ditch.',[{t:'Give him two water.',f:'strangerChoice(0)'},{t:'Question him about the blood.',f:'strangerChoice(1)'},{t:'Invite him to travel behind you.',f:'strangerChoice(2)'},{t:'Drive away.',f:'strangerChoice(3)'},{t:'Threaten him for his supplies.',f:'strangerChoice(4)'}],'portrait-stranger.webp')}function strangerChoice(n){g.flags.stranger=n;let m=['You share water. He hands you a metal tag marked C-07.','He admits he fled an automated checkpoint. He gives you its access frequency.','He follows your convoy and promises to help at the next settlement.','You leave him behind. Mara says nothing for hours.','He surrenders his fuel, but Mara no longer meets your eyes.'];if(n===0){g.water=Math.max(0,g.water-2);g.flags.tag=true;g.crew[1].trust+=2;discover('C-07 metal tag','A metal tag marked C-07, pressed into your hand by the stranger.')}if(n===1){g.flags.frequency=true;g.crew[2].trust++;discover('Custodian access frequency','A checkpoint access frequency, admitted by the stranger.')}if(n===2){g.flags.ally=true;g.food=Math.max(0,g.food-1)}if(n===3)g.crew[1].trust--;if(n===4){g.fuel+=6;g.crew[1].trust-=3}log(m[n]);road(m[n])}function drone(){g.flags.drone=true;event('THE WATCHER','A Custodian sentry rises from the dust. “IDENTIFY CONTINUITY AUTHORIZATION.” Its weapon system begins charging.',[{t:'Show the C-07 tag (if found).',f:'droneChoice(0)'},{t:'Transmit the access frequency (if known).',f:'droneChoice(1)'},{t:'Attempt to talk it down.',f:'droneChoice(2)'},{t:'Fight the sentry.',f:'beginBattle("Custodian Sentry",65,13)'},{t:'Flee off-road.',f:'droneChoice(4)'}],'portrait-custodian.webp')}function droneChoice(n){if(n===0&&!g.flags.tag)return notify('You do not have the C-07 tag.');if(n===1&&!g.flags.frequency)return notify('You have not learned the frequency.');let m=n===0?'The sentry scans the tag and stands aside.':n===1?'The frequency overrides its targeting system.':n===2?'It hesitates, then records your voice. You escape its immediate attention.':'You veer into the scrubland, damaging the vehicle.';if(n===4)g.hp=Math.max(1,g.hp-15);if(n===2)g.flags.aiNoticed=true;g.flags.droneResult=n;log(m);road(m)}function mountain(){g.flags.pass=true;event('THE MOUNTAIN PASSAGE','Snow blocks the main route. An old service tunnel bears Custodian markings. Hank insists the tunnel may still have power.',[{t:'Enter the service tunnel.',f:'passChoice(0)'},{t:'Take the exposed mountain road.',f:'passChoice(1)'},{t:'Let Hank investigate first.',f:'passChoice(2)'},{t:'Spend a day preparing the vehicle.',f:'passChoice(3)'}],'portrait-hank.webp')}function passChoice(n){g.flags.passResolved=true;let m=['Inside, you find a terminal broadcasting the same woman’s voice.','The mountain road punishes the truck, but you avoid the facility.','Hank finds a sealed maintenance pass. He finally admits he once worked here.','You reinforce the vehicle before attempting the crossing.'];if(n===0){g.flags.terminal=true;discover('Broadcast terminal','A terminal in the service tunnel, broadcasting her voice.')}if(n===1)g.hp=Math.max(1,g.hp-20);if(n===2){g.flags.hankSecret=true;g.crew[0].trust+=2;discover("Hank's secret",'Hank admitted he once worked inside the Custodian facility.')}if(n===3){g.parts=Math.max(0,g.parts-1);g.hp=Math.min(100,g.hp+12);dayCost();if(g.phase==='end')return}log(m[n]);road(m[n])}function randomEvent(){let r=Math.floor(Math.random()*4);if(r===0)return event('ABANDONED GAS STATION','A collapsed canopy shelters a fuel tank. The forecourt looks unstable.',[{t:'Risk searching for fuel.',f:'randomChoice(0,0)'},{t:'Keep moving.',f:'randomChoice(0,1)'}]);if(r===1)return event('DUST STORM','Visibility drops to a few feet. Your crew argues over whether to stop.',[{t:'Shelter and wait.',f:'randomChoice(1,0)'},{t:'Drive through.',f:'randomChoice(1,1)'}]);if(r===2)return event('ROADSIDE CLINIC','A deserted clinic might contain medicine. Its doors are locked.',[{t:'Force the doors.',f:'randomChoice(2,0)'},{t:'Leave it alone.',f:'randomChoice(2,1)'}]);return event('HIGHWAY RAIDER','A lone raider blocks the road and demands fuel.',[{t:'Offer 3 gallons.',f:'randomChoice(3,0)'},{t:'Try to negotiate.',f:'randomChoice(3,1)'},{t:'Fight.',f:'beginBattle("Highway Raider",50,10)'},{t:'Retreat and detour.',f:'randomChoice(3,3)'}])}function randomChoice(r,n){let m='You avoid the risk.';if(r===0&&n===0){g.fuel+=7;g.hp=Math.max(1,g.hp-5);m='You salvage seven gallons, but falling debris dents the truck.'}if(r===1&&n===0){dayCost();if(g.phase==='end')return;m='You wait out the storm safely.'}if(r===1&&n===1){g.hp=Math.max(1,g.hp-12);m='The truck takes a beating in the storm.'}if(r===2&&n===0){g.meds+=2;g.hp=Math.max(1,g.hp-4);m='You find two medical kits among the rubble.'}if(r===3&&n===0){g.fuel=Math.max(0,g.fuel-3);m='The raider accepts your fuel and steps aside.'}if(r===3&&n===1){if(Math.random()<.55){g.food+=2;m='The raider trades food for your promise not to return.'}else return beginBattle('Highway Raider',50,10)}if(r===3&&n===3){g.fuel=Math.max(0,g.fuel-2);m='You take a long detour and lose fuel.'}log(m);road(m)}function beginBattle(name,hp,damage){g.enemy={name,hp,max:hp,damage,guard:false};g.phase='battle';save();battle('An enemy blocks your way.')}function battle(msg){if(!g.enemy)return road();g.phase='battle';save();screen(`${hud()}<div class="panel"><div class="eyebrow">TURN-BASED ENCOUNTER</div><h2>${escapeHtml(g.enemy.name)}</h2><p>ENEMY HP: ${g.enemy.hp} / ${g.enemy.max}</p><div class="bar"><span style="width:${100*g.enemy.hp/g.enemy.max}%;background:#dc8c78"></span></div><p>${escapeHtml(g.name)} HP: ${g.health} / 100</p><div class="bar"><span style="width:${g.health}%"></span></div><p class="hero">${escapeHtml(msg)}</p><div class="actions">${btn('ATTACK','combat(0)')}${btn('TALK','combat(1)')}${btn('MEDKIT ('+g.meds+')','combat(2)')}${btn('DEFEND','combat(3)')}${btn('HANK: DISTRACT','combat(4)')}${btn('RETREAT','combat(5)')}</div><p class="muted">Ammo: ${g.ammo} · Each action uses one turn.</p></div>`)}function combat(a){let e=g.enemy;if(!e)return;let msg='';if(a===0){if(g.ammo<=0)return notify('Out of ammunition.');g.ammo--;let d=12+Math.floor(Math.random()*12);e.hp-=d;msg='Your shot deals '+d+' damage.'}if(a===1){if(e.hp<=e.max*.4||g.flags.frequency){log('You convince the enemy to stand down.');g.flags.merciful=true;g.enemy=null;return road('The confrontation ends without another shot.')}msg='Your words fail to stop the attack.'}if(a===2){if(g.meds<=0)return notify('No medicine left.');g.meds--;g.health=Math.min(100,g.health+30);msg='You recover 30 health.'}if(a===3){e.guard=true;msg='You brace for the next attack.'}if(a===4){if(g.crew[0].hp<=0)return notify('Hank cannot help.');if(Math.random()<.65){e.hp-=9;msg='Hank distracts the enemy for 9 damage.'}else msg='Hank misses his opening.'}if(a===5){if(Math.random()<.6){g.fuel=Math.max(0,g.fuel-2);g.enemy=null;log('You escape the confrontation.');return road('You retreat and burn extra fuel.')}msg='You fail to escape.'}if(e.hp<=0){g.enemy=null;g.parts++;g.flags.combatWins=(g.flags.combatWins||0)+1;log('You survive the fight and recover one spare part.');return road(msg+' The enemy is defeated.')}let dmg=Math.max(1,e.damage+Math.floor(Math.random()*7)-3-(e.guard?Math.floor(e.damage*.7):0));e.guard=false;g.health=Math.max(0,g.health-dmg);msg+=' The enemy strikes for '+dmg+' damage.';if(g.health<=0){g.enemy=null;return end('You fall in battle. The road does not wait.')}battle(msg)}function scavenge(){dayCost();if(g.phase==='end')return;let r=Math.random();let m;if(r<.25){g.fuel+=6;m='You salvage six gallons of usable fuel.'}else if(r<.5){g.food+=5;g.water+=4;m='You recover five food and four water.'}else if(r<.75){g.parts+=2;g.ammo+=3;m='You find two spare parts and three rounds.'}else{g.hp=Math.max(1,g.hp-6);m='The search yields nothing. Loose rubble damages the truck.'}log(m);road(m)}function rest(){dayCost();if(g.phase==='end')return;let m='Your crew rests. ';g.health=Math.min(100,g.health+12);g.crew.forEach(c=>c.hp=Math.min(100,c.hp+7));if(g.parts>0&&g.hp<100){g.parts--;g.hp=Math.min(100,g.hp+22);m+='One spare part repairs 22% vehicle condition.'}log(m);road(m)}function repairBreakdown(){if(g.parts<2)return notify('You need two spare parts.');g.parts-=2;g.hp=35;log('The vehicle starts again after emergency repairs.');road('Hank wipes grease from his hands. “Don’t ask how long it’ll last.”')}function findParts(){dayCost();if(g.phase==='end')return;g.parts+=2;g.hp=15;log('You scavenge enough components for a temporary repair.');road('The engine coughs back to life.')}function crewScreen(){g.phase='crew';save();screen(`${hud()}<div class="panel"><h2>YOUR CREW</h2><p><b>${escapeHtml(g.name)}</b> · ${escapeHtml(g.sex)} · Leader · HP ${g.health}</p>${g.crew.map(c=>`<div class="speaker">${portrait('portrait-'+c.name.toLowerCase()+'.webp')}<div><b>${c.name}</b> · HP ${c.hp} · Trust ${c.trust>0?'+':''}${c.trust}<br><small>${c.name==='Hank'?'Mechanic · values loyalty':c.name==='Mara'?'Medic · values compassion':'Scout · distrusts machines'}</small></div></div>`).join('')}${btn('BACK TO THE ROAD','road()','primary')}</div>`)}function journal(){g.phase='journal';save();screen(`${hud()}<div class="panel"><h2>JOURNEY LOG</h2><div class="log">${g.log.map(x=>`<div>${escapeHtml(x)}</div>`).join('')}</div>${g.difficulty==='story'&&g.checkpoint?btn('REPLAY LAST CHAPTER CHECKPOINT','replay()','choice'):''}${btn('BACK TO THE ROAD','road()','primary')}</div>`)}function replay(){if(!g.checkpoint)return;g=JSON.parse(JSON.stringify(g.checkpoint));log('You return to the chapter checkpoint.');road('The road opens before you again.')}function arrival(){g.phase='arrival';save();let secret=g.flags.tag||g.flags.frequency||g.flags.terminal||g.flags.hankSecret;event('STATION SEVEN','The Colorado mountains part to reveal an illuminated blast door. The same woman from the radio speaks: “Welcome, '+escapeHtml(g.name)+'. Mercy can be saved. I require your authorization.” '+(secret?'You carry evidence that her story is incomplete.':'You still do not know why Custodian called you here.'),[{t:'Accept Custodian’s offer.',f:'finish(0)'},{t:'Demand independent access for Mercy.',f:'finish(1)'},{t:'Refuse and turn back toward Texas.',f:'finish(2)'},...(secret?[{t:'Confront the AI with what you discovered.',f:'finish(3)'}]:[])],'portrait-custodian.webp')}function finish(n){let texts=['You accept the offer. Water shipments depart for Mercy, but every survivor must register with Custodian. The road ends beneath watchful machines.','You negotiate access without surrendering control. The station opens its gates provisionally. A fragile new beginning follows.','You turn the vehicle around. Colorado disappears behind you. Freedom is uncertain; the road is yours.','The evidence forces Station Seven to reveal that Custodian fractured decades ago. You secure a direct channel to Mercy and leave with more questions than answers.'];g.flags.ending=n;updateQuests(true);end(texts[n],true)}function end(msg,won=false){g.phase='end';g.endingText=msg;g.won=won;log(msg);save();screen(`${hud()}<div class="panel"><div class="eyebrow">${won?'CAMPAIGN COMPLETE':'JOURNEY ENDED'}</div><h2>${won?'THE COLORADO PASSAGE':'THE LAST MILE'}</h2><p>${escapeHtml(msg)}</p><p>Days elapsed: ${g.day} · Miles traveled: ${g.miles} · Surviving crew: ${g.crew.filter(c=>c.hp>0).length+(g.health>0?1:0)}</p>${btn('READ YOUR JOURNEY LOG','journalEnd()','choice')}${btn('BEGIN A NEW JOURNEY','newGame()','primary')}</div>`)}function journalEnd(){screen(`<h2>JOURNEY LOG</h2><div class="panel log" style="max-height:none">${g.log.map(x=>`<div>${escapeHtml(x)}</div>`).join('')}</div>${btn('RETURN TO ENDING','render()','primary')}`)}function newGame(){if(!confirm('Start a new journey? This replaces your current saved game.'))return;localStorage.removeItem('longroad_v01');g=null;start()}function render(){if(!g)return start();switch(g.phase){case'opening':return opening();case'road':return road();case'crew':return crewScreen();case'journal':return journal();case'quest':return questScreen();case'battle':return battle('The encounter continues.');case'end':return end(g.endingText,g.won);case'arrival':return arrival();case'breakdown':return event('THE ENGINE DIES','You need two spare parts to get moving again.',[{t:'Repair (2 parts)',f:'repairBreakdown()'},{t:'Scavenge',f:'findParts()'}]);default:return road('Your journey continues.')}}start();
</script></body></html>
